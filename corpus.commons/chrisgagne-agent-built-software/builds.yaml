# Build profiles for the chrisgagne-agent-built-software corpus. build.js discovers this file at load time.
#
# factory-warranty is the corpus's app: the warranting-agent-built-software distillations, their indexes and the
# factory, the harness that reads them while it builds, gates and reviews a change. The factory's code lives at
# helpers/factory-warranty/ and is copied into the app at factory/ (see the helpers note in the root builds.yaml).

builds:
  factory-warranty:
    description: 'A software factory and its knowledge layer: coding agents build a change, deterministic gates
      and two independent model-family reviewers check it against distillations of 18 open sources (NIST, OWASP,
      CISA, UK government assurance guidance, and research on AI-assisted development), and the accountable person
      signs or returns a warranty pack written for someone who doesn''t read the code.'
    source_dir: corpus.commons/chrisgagne-agent-built-software
    output_dir: corpus.commons/chrisgagne-agent-built-software/apps/factory-warranty
    helpers_dir: factory
    recommends_capabilities:
    - name: delivery-metrics
      purpose: Read the change ledger, CI runs and release records to see what was demonstrated
      fallback: Practitioner pastes the ledger, warranty pack or run output
    - name: issue-tracker
      purpose: Read the story and its acceptance criteria
      fallback: Practitioner pastes the story
    max_scope: open-nc
    max_visibility: open-nc
    references:
      include_patterns:
      - '*.md'
      exclude_patterns:
      - _ingest_pass_*
      - _ingest_*
    distillations:
      include:
      - warranting-agent-built-software
    lenses:
      include: false
    skills:
      include:
      - matching-references
      - answer-from-corpus
    agents:
      include: []
    claude_md:
      template: factory-warranty
    docs:
      include:
      - docs/architecture
      - docs/reference
      - docs/README.md
    validation:
      ignore_dangling:
      - corpus.commons/chrisgagne-agent-built-software/
      - _planning/*
      - docs/how-to/*
      - docs/how-to/
      - docs/tutorial/*
      - docs/tutorial/
      - docs/sources/*
      - docs/sources/
      - docs/evals/*
      - docs/evals/
      - docs/assets/*
      - deploy/*
      - deploy/
      - lenses/
      - lenses/LENS-INDEX.md
      - distillations/decision-making/*
      - distillations/stakeholder-engagement/*
      - distillations/software-business/*
      - .claude/skills/ingesting-resources/*
      - .claude/skills/creating-tasks/*
      - .claude/skills/creating-applications/*
      - .claude/skills/creating-distillations/*
