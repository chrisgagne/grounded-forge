- file: becker-metr-ai-developer-productivity-2025-images/p0010-1.png
  source_ref: becker-metr-ai-developer-productivity-2025
  page: 10
  section: 3 Results
  description: Figure 6 is a grouped bar chart of the average percentage of time spent per activity among labeled screen recordings, AI-disallowed (N=30) versus AI-allowed (N=44). With AI allowed, active coding falls from about 36% to 24% and reading and searching from about 24% to 17%, while reviewing AI output (about 9%), prompting AI (about 8%), waiting on AI (about 4%) and idle or overhead (about 6% to 10%) take time. Testing and debugging and git and environment change little.
