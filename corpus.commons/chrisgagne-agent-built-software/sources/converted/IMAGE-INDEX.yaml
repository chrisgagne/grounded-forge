  - prompting
  - reviewing-ai-output
  - waiting-on-ai
  style: chart
  frameworks: []
  suggested_use: Use to show where the time went when AI was allowed, since new work (prompting, waiting, reviewing) replaced coding and searching rather than adding to them.
