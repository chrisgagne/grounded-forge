  source_ref: becker-metr-ai-developer-productivity-2025
  page: 9
  section: 3 Results
  description: Figure 5 plots the empirical cumulative distribution of observed implementation times, with implementation time in hours on a log x axis (0.125 to 8+) and percentile on the y axis (0 to 100). The AI-disallowed (N=110, purple) and AI-allowed (N=136, green) curves overlap below about one hour, then the AI-allowed curve shifts right, so longer tasks take longer when AI is allowed.
