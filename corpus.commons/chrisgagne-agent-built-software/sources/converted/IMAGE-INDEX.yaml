- file: becker-metr-ai-developer-productivity-2025-images/p0002-1.png
  source_ref: becker-metr-ai-developer-productivity-2025
  page: 2
  section: 1 Introduction
  description: 'Figure 1, titled ''Experts and Study Participants Misjudge AI Speedup'', plots the change in time when AI is allowed (y axis from -50% faster to +40% slower) for five groups: economics expert forecasts (about -39%), ML expert forecasts (about -38%), developer forecasts during the study (about -24%), developer estimates after the study (about -20%), and the observed result (red, about +19%, interval from near 0% to about +39%). Every prediction expected a speedup of 20 to 40%, while the measured result was a slowdown.'
  tags:
  - ai-productivity
  - forecast-vs-observed
  - expert-forecasts
  - perception-gap
  - randomized-controlled-trial
  - confidence-intervals
  style: chart
  frameworks: []
  suggested_use: Show when making the case that people, including experts, misjudge what an AI tool does to their own speed, so measurement beats self-report.
- file: becker-metr-ai-developer-productivity-2025-images/p0004-1.png
  source_ref: becker-metr-ai-developer-productivity-2025
  page: 4
  section: 2 Methodology
  description: Figure 2 is a flow diagram of the study design. Issues from a repository (example stdlib-js/stdlib) carry developer forecasts with and without AI; a developer (300 commits, 3 years of contribution) receives training (set up Cursor, learn agent mode); each issue is randomized to an AI-disallowed or AI-allowed arm with the same steps (implement issue, open pull request, address review, merge, report time). Panel 3 calculates the change in time from AI as E[time AI allowed] / E[time AI disallowed] - 1, screen recordings get activity labels, and the speedup comparison sets expert forecasts (E), participant forecasts (1), participant estimates (2) and observed result (3) side by side, fed by expert forecast collection and an exit interview.
  tags:
  - experimental-design
  - randomized-controlled-trial
  - study-protocol
  - issue-randomization
  - screen-recordings
  - forecast-collection
  style: flowchart
  frameworks: []
  suggested_use: Use to explain how the study separated the effect of AI from task difficulty by defining issues before randomizing them to AI-allowed or AI-disallowed.
- file: becker-metr-ai-developer-productivity-2025-images/p0005-1.png
  source_ref: becker-metr-ai-developer-productivity-2025
  page: 5
  section: 2.2 Experimental Design
  description: Figure 3 shows two real study records as cards. A stdlib-js/stdlib bug issue (nlp-sentencize splits sentences on repeated punctuation) was forecast at 1 hr without AI and 45 min with AI, randomized AI-disallowed, and took 24 min initial implementation with 0 min post-review. A mito-ds/mito issue (Polish Chat Input) was forecast at 1 hr without AI and 30 min with AI, randomized AI-allowed, and took 36 min. Each card has the labelled sections before-randomization forecasts, issue randomization, and after-completion pull request link, screen recording and times.
