essary part ", "marker": "V", "match": "3 of 3 keywords"}, "light": {"path": "references/mcdp1-warfighting.md", "line": 26, "text": "- **Ch 3 Preparing for War.** Concept-based force planning. Organization in Marine air-ground task forces (MAGTFs). Doctrine as authoritative but not prescriptive: general guidance that requires judgment in application. Professionalism: boldness and initiative, leniency for errors of overboldness and severity for errors of inaction or timidity, trust, honest dissent before a decision and full support after it. Traini", "marker": null, "match": "1 of 3 keywords"}, "distillations": [{"path": "distillations/aar/mcdp1-warfighting-aar.md", "line": 31, "text": "5. <!-- concept: leniency-overbold-severity-inaction --> **Inaction is an error too.** \"we should deal severely with errors of inaction or timidity. We will not accept lack of orders as justification for inaction\" [V] (Source: Ch 3, \"Professionalism\"). Read with \"Risk is equally common to action and inaction.\" [V] (Ch 1, \"Uncertainty\"), this puts waiting and not acting inside the review's scope. The source states the", "marker": "V", "match": "3 of 3 keywords", "task": "aar"}, {"path": "distillations/decision-making/mcdp1-warfighting-decision-making.md", "line": 43, "text": "10. <!-- concept: leniency-overbold-severity-inaction --> **An asymmetric response to error, with limits.** \"errors by junior leaders stemming from overboldness are a necessary part of learning\" [V]; \"We should deal with such errors leniently\" [V], with no zero-defects mentality (Ch 3, \"Professionalism\"). The other side of the rule: \"we should deal severely with errors of inaction or timidity. We will not accept lack", "marker": "V", "match": "3 of 3 keywords", "task": "decision-making"}, {"path": "distillations/retro/mcdp1-warfighting-retro.md", "line": 33, "text": "5. <!-- concept: leniency-overbold-severity-inaction --> **Severity for errors of inaction.** Against the leniency for bold errors, the doctrine says *\"we should deal severely with errors of inaction or timidity\"* [V]; *\"We will not accept lack of orders as justification for inaction; it is each Marine's duty to take initiative as the situation demands\"* [V]; and *\"We must not tolerate the avoidance of responsibility", "marker": "V", "match": "3 of 3 keywords", "task": "retro"}, {"path": "distillations/software-business/mcdp1-warfighting-software-business.md", "line": 11, "text": "MCDP 1 gives an engineering leader a vocabulary for commanding work under uncertainty without trying to control every step of it. Four of its ideas land where engineering capacity meets commercial commitment. Every mission has a task and an intent, and the intent governs because it outlasts the task (Ch 4, \"Commander's intent\"). One action is named the main effort and gets priority for support, which means strict eco", "marker": "AR", "match": "2 of 3 keywords", "task": "software-business"}, {"path": "distillations/stakeholder-engagement/mcdp1-warfighting-stakeholder-engagement.md", "line": 41, "text": "11. <!-- concept: leniency-overbold-severity-inaction --> **Leniency for overbold errors, severity for inaction.** \"errors by junior leaders stemming from overboldness are a necessary part of learning\" [V], and \"there must be no 'zero defects' mentality\" [V]; on the other hand \"we should deal severely with errors of inaction or timidity\" [V], and \"We will not accept lack of orders as justification for inaction\" [V]. ", "marker": "V", "match": "3 of 3 keywords", "task": "stakeholder-engagement"}]}, "figure": null, "show": "paraphrase", "hit_page": 67, "pages": [{"n": 67, "png": "pages/00q-67-mcdp-inaction.png", "boxes": [[0.14910536628550872, 0.158732174685604, 0.42552096486644475, 0.1859222952256286], [0.4333213760650206, 0.158732174685604, 0.8319226874546178, 0.1859222952256286], [0.3696281087317636, 0.18328231015414018, 0.6513577819444237, 0.2099911898662269], [0.21083497461376718, 0.20687322545024986, 0.48160072178419633, 0.23454458681821233], [0.49569947028205924, 0.20687322545024986, 0.8780481659665471, 0.23454458681821233], [0.893925126265467, 0.20687322545024986, 0.9080238326306016, 0.23454458681821233], [0.14910536628550872, 0.2319645194637626, 0.455037806118498, 0.2591546124807201]], "folio": 58}], "page_layout": "pdf", "page_via": "the folio printed on the PDF page"}, "pom-involvement-blame": {"source": "00j", "corpus": "demo", "status": "exact", "verified": true, "hits": 1, "text": "Control in high-involvement organizations is diffused through many groups and is commonly focused on task accomplishment and overcoming obstacles, with a de-emphasis on fixing blame with a particular individual for performance failures. In many control-oriented management systems, the reins of control are firmly held by the hierarchy, and the activities of individuals are carefully controlled.", "anchor": "Control in high-involvement organizations is diffused through many groups and is", "line": 25905, "locator": "Ch 17.7 • Management by Objectives: A Planning and Control Technique", "page": 517, "context": {"before": "The organic organization, with its involvement-oriented management practices, places the employee as an active player in both the planning and controlling activity. Management’s role becomes one of a consultant, facilitator, enabler, philosopher, teacher, coach, and resource provider as employees take on active roles in planning and controlling and in assuming responsibility for the execution of both activities.\n\nUpper-level managers assume responsibility for planning and controlling their units while employees assume the right and responsibility for planning and controlling at their job level. As upper-level managers carry out their planning and controlling activities, they do so by soliciting input from those below them in the organizational hierarchy.", "after": "Finally, mechanistic organizations are more likely to create large planning departments and to centralize the planning function with specialists. As organizations confront increasing environmental or technology-induced uncertainty, rapid environmental change, and turbulence, planning and controlling move closer to the point in the organization where the plans are implemented and carried out on a day-to-day basis. In place of hierarchy- based control, organizations rely more on professional employees and groups of employees to control their own actions as they execute organizational plans.\n\nCONCEPT CHECK", "lead": "Systems such as MBO are much more likely to characterize the planning and controlling process in involvement-oriented organizations than in control-oriented organizations.", "tail": "Performance failures, therefore, tend to become focused on the individual who fails to perform."}, "layers": {"deep": {"path": "references/openstax-principles-management-deep.md", "line": 986, "text": "The control-oriented vs involvement-oriented approaches to planning and controlling are contrasted (Ch 17.8, \"The Control- and Involvement-Oriented Approaches to Planning and Controlling\"): in the mechanistic organisation both activities tend to be lodged with management in the hierarchy, often above the point where plans are carried out, and the employee is often a passive player; the organic organisation's involvem", "marker": "V", "match": "3 of 3 keywords"}, "light": {"path": "references/openstax-principles-management.md", "line": 86, "text": "Technology is the processes converting inputs into outputs plus evaluation and control mechanisms. Management of technology is planning, implementation, evaluation, and control of resources to create value and competitive advantage. Innovation includes newness in products and processes; management of innovation requires casting a wide net, creating newness with existing products, opening culture, communicating knowle", "marker": null, "match": "1 of 3 keywords"}, "distillations": []}, "figure": null, "show": "quote", "hit_page": 532, "pages": [{"n": 532, "png": "pages/00j-532-pom-involvement-blame.png", "boxes": [[0.6388676462609784, 0.53096590138445, 0.8352793275920394, 0.5464431685630722], [0.11764705882352941, 0.5480113559299045, 0.8280002868253421, 0.5634886231085267], [0.11764705882352941, 0.565056810475359, 0.8295001858979268, 0.5805340776539812], [0.11764705882352941, 0.5821022650208136, 0.8708382400811887, 0.5975795321994357], [0.11764705882352941, 0.5991477195662681, 0.4966028749553207, 0.6146249867448903]], "folio": 518}], "page_layout": "pdf", "page_check": {"checked": true, "differences": []}}, "pom-escalation": {"source": "00j", "corpus": "demo", "status": "exact", "verified": true, "hits": 1, "text": "Effective managers recognize that progress down the wrong path isn’t really progress, and they are willing to reevaluate decisions and change", "anchor": "progress down the wrong path isn't really progress, and they are willing", "line": 1729, "locator": "Ch 2.4 • Barriers to Effective Decision-Making", "page": 29, "context": {"before": "Given the lack of complete information, managers don’t always make the right decision initially, and it may not\n\nCONCEPT CHECK", "after": "direction when appropriate.\n\nTime Constraints", "lead": "2.4 • Barriers to Effective Decision-Making     29 be clear that a decision was a bad one until after some time has passed. For example, consider a manager who had to choose between two competing software packages that her organization will use on a daily basis to enhance efficiency. She initially chooses the product that was developed by the larger, more well-established company, reasoning that they will have greater financial resources to invest in ensuring that the technology is good. However, after some time it becomes clear that the competing software package is going to be far superior. While the smaller company’s product could be integrated into the organization’s existing systems at little additional expense, the larger company’s product will require a much greater initial investment, as well as substantial ongoing costs for maintaining it. At this point, however, let’s assume that the manager has already paid for the larger company’s (inferior) software. Will she abandon the path that she’s on, accept the loss on the money that’s been invested so far, and switch to the better software? Or will she continue to invest time and money into trying to make the first product work? Escalation of commitment is the tendency of decision makers to remain committed to poor decision, even when doing so leads to increasingly negative outcomes. Once we commit to a decision, we may find it difficult to reevaluate that decision rationally. It can seem easier to “stay the course” than to admit (or to recognize) that a decision was poor. It’s important to acknowledge that not all decisions are going to be good ones, in spite of our best efforts.", "tail": ""}, "layers": {"deep": {"path": "references/openstax-principles-management-deep.md", "line": 85, "text": "2. *Escalation of commitment* — \"the tendency of decision makers to remain committed to poor decision, even when doing so leads to increasingly negative outcomes\" [V] (Ch 2.4). \"Effective managers recognize that progress down the wrong path isn't really progress, and they are willing to reevaluate decisions and change direction when appropriate\" [V] (Ch 2.4).", "marker": "V", "match": "3 of 3 keywords"}, "light": {"path": "references/openstax-principles-management.md", "line": 42, "text": "Entrepreneurs have vision, drive, and creativity, willing to take risk for profit; small-business owners stay small by choice. Three types: classic (with micropreneurs and growth-oriented sub-types), multipreneurs, intrapreneurs. Nine entrepreneurial traits: ambitious, independent, self-confident, risk-taker (moderate, controlled risk), visionary, creative, energetic, passionate, committed. US small businesses (under", "marker": null, "match": "1 of 3 keywords"}, "distillations": [{"path": "distillations/decision-making/openstax-principles-management-decision-making.md", "line": 106, "text": "| Be willing to reverse | If new information indicates the decision was wrong, am I able to reverse course, or escalating commitment to defend the prior choice? |", "marker": null, "match": "1 of 3 keywords", "task": "decision-making"}, {"path": "distillations/retro/openstax-principles-management-retro.md", "line": 26, "text": "8. <!-- concept: lencioni-five-dysfunctions --> **Lencioni's Five Dysfunctions** — absence of trust → fear of conflict → lack of commitment → avoidance of accountability → inattention to results (Ch 15.4, \"Opportunities and Challenges to Team Building\"). The chain begins at the foundation: \"The first dysfunction is an absence of trust among team members. Essentially, this stems from their unwillingness to be vulnerab", "marker": "V", "match": "1 of 3 keywords", "task": "retro"}, {"path": "distillations/software-business/openstax-principles-management-software-business.md", "line": 143, "text": "- **Pattern: Team stuck in Storming and not progressing.** Signal: ongoing competition for leadership, frustration around goals, no shared norms emerging. Diagnosis: Tuckman's Storming stage has stalled; the team is missing the norming work that produces ground rules and mutual respect. Follow-up: invest in norming explicitly — first meetings and rules of behaviour matter (per Katzenbach-Smith); name the stage rather", "marker": null, "match": "2 of 3 keywords", "task": "software-business"}]}, "figure": null, "show": "paraphrase", "hit_page": 44, "pages": [{"n": 44, "png": "pages/00j-44-pom-escalation.png", "boxes": [[0.6088235393848295, 0.31214769922121605, 0.8475442524828942, 0.32762496639983824], [0.11764705882352941, 0.32919315376667063, 0.17857350866779004, 0.34467042094529277], [0.1823970320957159, 0.32919315376667063, 0.36239703807955476, 0.34467042094529277], [0.3662205615074806, 0.32919315376667063, 0.56239702810649, 0.34467042094529277], [0.5662205515344159, 0.32919315376667063, 0.803558898127936, 0.34467042094529277], [0.8073824215558619, 0.32919315376667063, 0.8582059573503881, 0.34467042094529277]], "folio": 30}], "page_layout": "pdf"}, "mcdp-reinforce-failure": {"source": "00q", "corpus": "demo", "status": "exact", "verified": true, "hits": 1, "text": "In gen- eral, when shifting the main effort, we seek to exploit success rather than reinforce failure.", "anchor": "when shifting the main effort, we seek to exploit success rather", "line": 3011, "locator": "MCDP 1", "page": 92, "context": {"before": "success. The main effort involves a physical and moral com-\n\nmitment, although not an irretrievable one. It forces us to concentrate decisive combat power just as it forces us to ac- cept risk. Thus, we direct our main effort against a center of gravity through a critical enemy vulnerability, exercising strict economy elsewhere.", "after": "SURFACES AID GAPS Put simply, surfaces are hard spots—enemy strengths—and gaps are soft spots—enemy weaknesses. We avoid enemy strength and focus our efforts against enemy weakness with\n\nthe object of penetrating the enemy system since pitting strength against weakness reduces casualties and is more likely to yield decisive results. Whenever possible, we exploit existing gaps. Failing that, we create gaps.", "lead": "Each commander should establish a main effort for each operation. As the situation changes, the commander may shift the main effort, redirecting the weight of combat power in support of the unit that is now most critical to success.", "tail": ""}, "layers": {"deep": {"path": "references/mcdp1-warfighting-deep.md", "line": 158, "text": "**Main effort.** *\"Of all the actions going on within our command, we recognize one as the most critical to success at that moment. The unit assigned responsibility for accomplishing this key mission is designated as the main effort — the focal point upon which converges the combat power of the force. The main effort receives priority for support of any kind. It becomes clear to all other units in the command that th", "marker": "V", "match": "3 of 3 keywords"}, "light": {"path": "references/mcdp1-warfighting.md", "line": 25, "text": "- **Ch 2 The Theory of War.** War must serve policy; strategies of annihilation / incapacitation and of erosion (the strategic sense of attrition renamed *erosion* so that *attrition* can name the tactical style). Means in war: military force is not to be considered in isolation from the other elements of national power, such as economic, diplomatic and psychological forces. The spectrum of conflict and the levels of", "marker": null, "match": "1 of 3 keywords"}, "distillations": [{"path": "distillations/aar/mcdp1-warfighting-aar.md", "line": 11, "text": "> Critiques are an important part of training because critical self-analysis, even after success, is essential to improvement. Their purpose is to draw out the lessons of training. As a result, we should conduct critiques immediately after completing training, before memory of the events has faded. Critiques should be held in an atmosphere of open and frank dialogue in which all hands are encouraged to contribute. We", "marker": "V", "match": "1 of 3 keywords", "task": "aar"}, {"path": "distillations/decision-making/mcdp1-warfighting-decision-making.md", "line": 169, "text": "| **OpenStax, *Organizational Behavior*** (Ch 6.4, 6.6) | OB names groupthink, where members keep their concerns and objections to themselves to keep the peace, and counters it with diverse membership, encouraging everyone to speak and a devil's advocate. MCDP 1 states the norm as a duty: honest professional opinion before the decision is a subordinate's duty, and yes-men are not tolerated. OB also names escalation o", "marker": null, "match": "3 of 3 keywords", "task": "decision-making"}, {"path": "distillations/retro/mcdp1-warfighting-retro.md", "line": 46, "text": "9. <!-- concept: main-effort --> **The main effort: one thing most critical now.** Of all the actions under way, one is recognised *\"as the most critical to success at that moment\"* [V] and *\"receives priority for support of any kind\"* [V]; faced with a decision, the rest of the command asks, *\"How can I best support the main effort?\"* [V] Choosing it means *\"In effect, we have decided: This is how I will achieve a d", "marker": "V", "match": "3 of 3 keywords", "task": "retro"}, {"path": "distillations/software-business/mcdp1-warfighting-software-business.md", "line": 66, "text": "| Move support toward success | If the main effort stalls while a secondary item is moving, are we shifting capacity to exploit the progress, or adding more to the stalled work? | [AP] Ch 4, \"Main effort\" |", "marker": "AP", "match": "3 of 3 keywords", "task": "software-business"}, {"path": "distillations/stakeholder-engagement/mcdp1-warfighting-stakeholder-engagement.md", "line": 33, "text": "9. <!-- concept: main-effort --> **Main effort ranks your own actions, not the parties.** \"Of all the actions going on within our command, we recognize one as the most critical to success at that moment.\" [V] The unit assigned that mission is the main effort and receives priority for support of any kind; the harmonising question for every subordinate facing a decision is \"How can I best support the main effort?\" [V].", "marker": "V", "match": "2 of 3 keywords", "task": "stakeholder-engagement"}]}, "figure": null, "show": "paraphrase", "hit_page": 101, "pages": [{"n": 101, "png": "pages/00q-101-mcdp-reinforce-failure.png", "boxes": [[0.37162040342655817, 0.4361903479870152, 0.6616954620175303, 0.46323349240242195], [0.6771480177510583, 0.4361903479870152, 0.902909721440359, 0.46323349240242195], [0.14072847919133133, 0.46099723238345564, 0.2725563137324978, 0.4877989339616555], [0.28021360284015584, 0.46099723238345564, 0.4860108396350926, 0.4877989339616555]], "folio": 92}], "page_layout": "pdf", "page_via": "the folio printed on the PDF page"}, "mcdp-doctrine-procedures": {"source": "00q", "corpus": "demo", "status": "exact", "verified": true, "hits": 1, "text": "Our doctrine does not consist of procedures to be applied in specific situations so much as it sets forth general guidance that requires judg-ment in application. Therefore, while authoritative, doctrine is not prescriptive.", "anchor": "Our doctrine does not consist of procedures to be applied in specific", "line": 1820, "locator": "MCDP 1", "page": 56, "context": {"before": "theory to its preparation and conduct.4 Doctrine establishes a particular way of thinking about war and a way of fighting. It also provides a philosophy for leading Marines in combat, a\n\nmandate for professionalism, and a common language. In short, it establishes the way we practice our profession. In this manner, doctrine provides the basis for harmonious actions and mutual understanding.", "after": "PROFESSIONALISM Marine Corps doctrine demands professional competence among its leaders. As military professionals charged with the defense of the Nation, Marine leaders must be true experts in the conduct of war. They must be individuals both of action and of intellect, skilled at \"getting things done\" while at the same time conversant in the military art. Resolute and self- reliant in their decisions, they must also be energetic and in- sistent in execution.5\n\n56", "lead": "Marine Corps doctrine is made official by the Comman- dant and is established in this publication.", "tail": ""}, "layers": {"deep": {"path": "references/mcdp1-warfighting-deep.md", "line": 114, "text": "**Doctrine.** *\"Doctrine is a teaching of the fundamental beliefs of the Marine Corps on the subject of war, from its nature and theory to its preparation and conduct. Doctrine establishes a particular way of thinking about war and a way of fighting.\"* [V] (Ch 3, \"Doctrine\") The discipline: *\"Our doctrine does not consist of procedures to be applied in specific situations so much as it sets forth general guidance tha", "marker": "V", "match": "3 of 3 keywords"}, "light": {"path": "references/mcdp1-warfighting.md", "line": 25, "text": "- **Ch 2 The Theory of War.** War must serve policy; strategies of annihilation / incapacitation and of erosion (the strategic sense of attrition renamed *erosion* so that *attrition* can name the tactical style). Means in war: military force is not to be considered in isolation from the other elements of national power, such as economic, diplomatic and psychological forces. The spectrum of conflict and the levels of", "marker": null, "match": "1 of 3 keywords"}, "distillations": [{"path": "distillations/aar/mcdp1-warfighting-aar.md", "line": 175, "text": "**Named limits of the source.** MCDP 1 is doctrine for warfighting, not an AAR text, and says it \"contains no specific techniques or procedures\" [V] (Foreword). Its review content is one paragraph, set in training rather than operations; carrying it to incidents is this projection's move. Its vocabulary is military (commander, subordinate, Marine), and the civilian translation here is operator-applied. The leniency-a", "marker": "V", "match": "3 of 3 keywords", "task": "aar"}, {"path": "distillations/decision-making/mcdp1-warfighting-decision-making.md", "line": 45, "text": "11. <!-- concept: doctrine-as-way-of-thinking --> **Guidance that requires judgment, not procedure.** \"Our doctrine does not consist of procedures to be applied in specific situations so much as it sets forth general guidance that requires judgment in application. Therefore, while authoritative, doctrine is not prescriptive\" [V] (Ch 3, \"Doctrine\"). The Foreword says the same of the whole book: \"It requires judgment i", "marker": "V", "match": "3 of 3 keywords", "task": "decision-making"}, {"path": "distillations/retro/mcdp1-warfighting-retro.md", "line": 16, "text": "Frame to bring: in a retro, MCDP 1 gives the lead a stance, not a procedure. The document says of itself that it *\"contains no specific techniques or procedures for conduct\"* [V] (Foreword). It tells the lead what the review is for, what climate makes it honest, and how to pick one experiment; the mechanics come from the Field Guide, Liberating Structures and the Open Practice Library. Throughout this distillation, *", "marker": "V", "match": "3 of 3 keywords", "task": "retro"}, {"path": "distillations/software-business/mcdp1-warfighting-software-business.md", "line": 176, "text": "**Named limits of the source.** MCDP 1 is doctrine for war. Its Foreword says it contains no specific techniques or procedures, only broad guidance in concepts and values that requires judgment in application. [AP] (Foreword) It does not mention software, products, markets, pricing, finance or any business framework; every software-business application here (the questions, patterns, trigger scripts and the worked sce", "marker": "AP", "match": "3 of 3 keywords", "task": "software-business"}, {"path": "distillations/stakeholder-engagement/mcdp1-warfighting-stakeholder-engagement.md", "line": 43, "text": "12. <!-- concept: doctrine-as-way-of-thinking --> **Guidance that requires judgment.** The Foreword: \"This book contains no specific techniques or procedures for conduct. Rather, it provides broad guidance in the form of concepts and values. It requires judgment in application.\" [V] Ch 3 says the same of doctrine generally: \"Our doctrine does not consist of procedures to be applied in specific situations so much as i", "marker": "V", "match": "3 of 3 keywords", "task": "stakeholder-engagement"}]}, "figure": null, "show": "quote", "hit_page": 65, "pages": [{"n": 65, "png": "pages/00q-65-mcdp-doctrine-procedures.png", "boxes": [[0.6740440385028073, 0.3811252035330811, 0.9076070069341649, 0.4085559307255411], [0.14644119704251354, 0.4054663013071255, 0.7765389381161518, 0.43313766267508796]], "folio": 56}], "page_layout": "pdf", "page_check": {"checked": true, "differences": [{"quote": "judg ment", "page": "judgment", "corrected": true}]}, "page_via": "the folio printed on the PDF page"}, "pom-merton-absolutes": {"source": "00j", "corpus": "demo", "status": "exact", "verified": true, "hits": 1, "text": "(2) Such devotion to the rules leads to their transformation into absolutes; they are no longer conceived as relative to a set of purposes. (3) This interferes with ready adaptation under special conditions not clearly envisaged by those who drew up the general rules.", "anchor": "devotion to the rules leads to their transformation into absolutes; they are", "line": 3608, "locator": "Ch 3, The History of Management", "page": 64, "context": {"before": "• Specialized roles • Recruitment based on merit • Uniform principles of placement, promotion, and transfer • Careerism with systematic salary structure • Hierarchy, responsibility, and accountability • Subjection of official conduct to strict rules of discipline and control • Supremacy of abstract rules • Impersonal authority (i.e., office bearer does not bring the office with him)\n\nThere was, however, a downside to this new managerial approach. A bureaucracy could shield bureaucrats from personal responsibility and initiative. Even worse, it could make them willing participants in criminal activities. American sociologist Robert K. Merton noted that in a bureaucracy, rules could become more important than actual goals. Merton wrote:", "after": "Another particular issue was that bureaucracy placed so much emphasis on legal authority that it ignored several important factors. The first factor is that bureaucratic laws are often incomplete due to problems in communication and understanding. Contracts tend to be abandoned rather than completed. No contract or law can consider every outcome or event. The second issue is that bureaucratic organizations ignored interpersonal authority and often relied only on reason and logic for decision-making. Often people followed their managers because they personally liked them rather than the legal aspect of authority. Managers that only use legal authority to gain performance are going to be really limited in the performance they will be able to garner (please see the chapter on leadership).\n\nBoth Fayol and Weber made significant contributions to management. Fayol’s ideas are the basis of modern strategy, as he attempted to understand what activities managers should do. His ideas inform management thoughts in terms of the various roles that managers need to undertake to ensure the cooperation of workers. Likewise, Weber’s ideas can be seen very clearly in human resource management in that managers should make decisions based on policy rather than whim. We can see that both men’s ideas about structure and the line of authority continue to have great influence in management today.", "lead": "An effective bureaucracy demands reliability of response and strict devotion to regulations.", "tail": "(4) Thus, the very elements which conduce toward efficiency in general produce inefficiency in specific instances. Full realization of the inadequacy is seldom attained by members of the group who have not divorced themselves from the meanings which the rules have for them. These rules in time become symbolic in cast, rather than strictly utilitarian.47"}, "layers": {"deep": {"path": "references/openstax-principles-management-deep.md", "line": 91, "text": "The section's Managerial Leadership feature, \"Satya Nadella’s Transformation of Microsoft\", draws on press sources [BT, Baker; Evans; McCraken; Palmer]; the text offers it, after arguing that relationship conflict shows why empathy benefits leaders, as a CEO encouraging empathetic collaboration [AR]. On becoming CEO in 2014, Nadella set out to move Microsoft from a culture of know-it-alls to one of learn-it-all, want", "marker": "AR", "match": "1 of 3 keywords"}, "light": {"path": "references/openstax-principles-management.md", "line": 54, "text": "Formal organisation is the officially function renderSourceMap(){

  const svg = el.append("svg").attr("width",W).attr("height",H).attr("viewBox",`0 0 ${W} ${H}`).style("max-width","100%").attr("role","img").attr("aria-label","Where each placed span sits in its source");
  const x = d3.scaleLinear().domain([0, d3.max(srcs,s=>s.words)]).range([0, W-labelW-rightW]);
  const g = svg.selectAll("g.row").data(srcs).join("g").attr("class","row").attr("transform",(d,i)=>`translate(0,${top+i*rowH})`);
  g.append("text").attr("x",0).attr("y",narrow ? 8 : 17).attr("class","ink").text(d=>narrow ? `${surname(d)}, ${shortTitle(d)}` : `${surname(d)}, ${shortTitle(d)}`.slice(0,36)).style("font-size","14px");
  const sy = narrow ? 26 : 13;
  g.append("line").attr("x1",labelW).attr("x2",d=>labelW+x(d.words)).attr("y1",sy).attr("y2",sy).attr("stroke","var(--g-rule)").attr("stroke-width",4).attr("stroke-linecap","round");

    const spans = Object.entries(BUNDLE.spans).filter(([id,s])=>s.source===d.id && s.verified).map(([id,s])=>({id,...s}));
    gg.selectAll("circle").data(spans).join("circle").attr("cx",s=>toX(s.line)).attr("cy",sy).attr("r",5).attr("fill",CORPUS[d.corpus].hex).attr("stroke","#fff").attr("stroke-width",2).style("cursor","pointer")
      .on("mousemove",(ev,s)=>showTip(ev,`<b>${esc(s.locator||"")}</b>${s.page?` · p. ${s.page}`:""}<br>“${esc(s.text.slice(0,140))}${s.text.length>140?"…":""}”`)).on("mouseleave",hideTip)

// ---------- figure 2: coverage ----------
function renderCoverage(){
  const el = d3.select("#coverage"); el.selectAll("*").remove();
  const srcs = Object.entries(BUNDLE.sources).map(([id,s])=>({id,...s})).sort((a,b)=>a.corpus.localeCompare(b.corpus)||surname(a).localeCompare(surname(b)));
  const rows = REPORT.subclaims, labelW = 190, cell = 24, top = 70, W = labelW + srcs.length*cell + 8, H = top + rows.length*cell + 6;
  const svg = el.append("svg").attr("width",W).attr("height",H).attr("viewBox",`0 0 ${W} ${H}`).style("max-width","100%").attr("role","img").attr("aria-label","Sub-claims by source");
  svg.selectAll("text.col").data(srcs).join("text").attr("class","col narrow").attr("transform",(d,i)=>`translate(${labelW+i*cell+cell/2+4},${top-8}) rotate(-60)`).text(d=>surname(d)).style("font-size","13px");
  svg.selectAll("line.h").data(rows).join("line").attr("x1",0).attr("x2",W).attr("y1",(d,i)=>top+i*cell+cell).attr("y2",(d,i)=>top+i*cell+cell).attr("stroke","var(--g-rule)");
  svg.selectAll("text.row").data(rows).join("text").attr("x",0).attr("y",(d,i)=>top+i*cell+16).attr("class","ink").text(d=>d.label).style("font-size","13px");
  rows.forEach((r,i)=>srcs.forEach((s,j)=>{
    const ids = r.spans.filter(id=>spanOf(id).source===s.id);
    if(!ids.length) return;
    const modes = ids.map(modeOf), m = modes.some(x=>x.m==="verbatim")?"verbatim":modes.some(x=>x.m==="para")?"para":"missing";
    const cx = labelW+j*cell+cell/2, cy = top+i*cell+cell/2, col = CORPUS[s.corpus].hex;
    const c = svg.append("circle").attr("cx",cx).attr("cy",cy).attr("r",5).attr("stroke","#fff").attr("stroke-width",2).style("cursor","pointer");
    if(m==="verbatim") c.attr("fill",col);
    else if(m==="para") c.attr("fill","#fff").attr("stroke",col).attr("stroke-width",2);
    else c.attr("fill","url(#hatch)");
    c.on("mousemove",ev=>showTip(ev,`<b>${esc(r.label)}</b> · ${esc(surname(s))}<br>${ids.length} span${ids.length>1?"s":""}, ${m==="verbatim"?"author's words":m==="para"?"paraphrased":"not placed"}`)).on("mouseleave",hideTip)
     .on("click",()=>{ const t=document.querySelector(`.v[data-id="${ids[0]}"]`); if(t){ t.scrollIntoView({behavior:"smooth",block:"center"}); closeSide(); openSide(t);} });
  }));
  const defs = svg.append("defs"); defs.append("pattern").attr("id","hatch").attr("width",4).attr("height",4).attr("patternUnits","userSpaceOnUse").attr("patternTransform","rotate(135)").append("line").attr("x1",0).attr("y1",0).attr("x2",0).attr("y2",4).attr("stroke","var(--g-ink)").attr("stroke-width",1);
}

// ---------- figure 3: whose words ----------
function renderInk(){
  const counts = {para:0, model:0}; for(const k of Object.keys(CORPUS)) counts[k]=0;
  for(const sec of REPORT.sections) for(const j of joinsOf(sec)){
    if(typeof j==="string"){ counts.model += words(j); continue; }
    const sp = spanOf(j.span), md = modeOf(j.span);
    if(md.m==="verbatim") counts[corpusOf(sp)] += words(sp.text); else counts.para += words(j.paraphrase);
  }
  const total = Object.values(counts).reduce((a,b)=>a+b,0), own = Object.keys(CORPUS).reduce((a,k)=>a+counts[k],0);
  document.getElementById("hero").innerHTML = `${Math.round(100*own/Math.max(1,total))}%<small>of the ${total.toLocaleString()} words in the body of this page are the authors' own, placed from the converted sources. The rest are the model's.</small>`;
  const segs = [...Object.keys(CORPUS).map(k=>[k,counts[k],CORPUS[k].hex,`author's words, ${k}`]),["para",counts.para,"#fff","paraphrase"],["model",counts.model,"#D5DAE0","model"]].filter(s=>s[1]>0);
  document.getElementById("strip").innerHTML = segs.map(s=>`<div style="flex:${s[1]};background:${s[2]};${s[0]==="para"?"outline:1.5px dashed var(--g-secondary);outline-offset:-1.5px;":""}" title="${s[3]}: ${s[1]} words"></div>`).join("");
  document.getElementById("striplabels").innerHTML = segs.map(s=>`<div><span class="sw" style="background:${s[2]};${s[0]==="para"?"outline:1.5px dashed var(--g-secondary);outline-offset:-1.5px;":""}"></span>${s[3]} ${s[1].toLocaleString()}</div>`).join("");
  window.OWN_SHARE = own/Math.max(1,total);
}

// ---------- charts: drawn only from numbers the span states ----------
// A chart sits in REPORT.charts; the resolver checks each drawn number against its span's placed text (BUNDLE.charts[i].ok).
const CHARTS = (REPORT.charts||[]).map((c,i)=>({...c, check:(BUNDLE.charts||[])[i]||{ok:false,why:"not checked by the resolver"}}));
function chartFigSpan(c){ return [c.span,...(c.figure_spans||[])].map(id=>({id,...spanOf(id)})).find(s=>s.figure); }
function renderChart(c,i){
  const host = document.getElementById(`chart-${i}`); if(!host) return;
  if(!c.check.ok){ host.innerHTML = `<div class="figtitle">${esc(c.title)}</div><p class="note">Chart withdrawn: ${esc(c.check.why)}. A chart is drawn only from numbers its passage states.</p>`; return; }
  host.innerHTML = `<div class="figtitle">${esc(c.title)}</div><div class="wrap"><div class="csvg"></div><div class="srcfig"></div></div><figcaption>${esc(c.caption||"")}</figcaption>`;
  const W = 540, H = 300, m = {t:14,r:150,b:34,l:44}, col = colourOf(spanOf(c.span)).hex, cols = ["var(--g-ink)", col, "var(--g-secondary)"];
  const svg = d3.select(host.querySelector(".csvg")).append("svg").attr("width","100%").attr("viewBox",`0 0 ${W} ${H}`).attr("role","img").attr("aria-label",c.title);
  if(c.kind==="growth"){
    const xmax = c.x_max||48, base = c.base||100, xs = d3.range(0,xmax+1);
    const series = c.series.map((s,k)=>({...s, rate:Math.pow(2,1/s.value)-1, col:cols[k%3]}));
    series.forEach(s=>s.pts = xs.map(t=>({t,v:base*Math.pow(1+s.rate,t)})));
    const x = d3.scaleLinear().domain([0,xmax]).range([m.l,W-m.r]), y = d3.scaleLinear().domain([0,d3.max(series,s=>s.pts[s.pts.length-1].v)]).nice().range([H-m.b,m.t]);
    svg.append("g").attr("transform",`translate(0,${H-m.b})`).call(d3.axisBottom(x).ticks(4).tickSize(0).tickPadding(8)).call(g=>g.select(".domain").attr("stroke","var(--g-rule)"));
    svg.append("g").attr("transform",`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(4).tickSize(0).tickPadding(6).tickFormat(d=>d>=1000?(d/1000)+"K":d)).call(g=>g.select(".domain").remove());
    svg.append("text").attr("x",W-m.r).attr("y",H-4).attr("text-anchor","end").text(c.x_label||"").style("font-size","12px");
    const line = d3.line().x(p=>x(p.t)).y(p=>y(p.v)).curve(d3.curveMonotoneX);
    series.forEach(s=>{
      svg.append("path").attr("d",line(s.pts)).attr("fill","none").attr("stroke",s.col).attr("stroke-width",2);
      const last = s.pts[s.pts.length-1];
      svg.append("circle").attr("cx",x(last.t)).attr("cy",y(last.v)).attr("r",4).attr("fill",s.col).attr("stroke","#fff").attr("stroke-width",2);
      svg.append("text").attr("x",x(last.t)+8).attr("y",y(last.v)+4).attr("class","ink").style("font-size","12px").text(s.label);
      svg.append("text").attr("x",x(last.t)+8).attr("y",y(last.v)+18).style("font-size","12px").style("fill","var(--g-secondary)").text(`doubling every ${s.value} ${c.x_label||""}, ${(100*s.rate).toFixed(2)}% each`);
      svg.append("text").attr("x",x(last.t)+8).attr("y",y(last.v)+32).style("font-size","12px").text(`${Math.round(last.v).toLocaleString()} at ${xmax}`);
      d3.range(1,12).forEach(k=>{ const t=s.value*k; if(t>xmax) return; svg.append("circle").attr("cx",x(t)).attr("cy",y(base*Math.pow(2,k))).attr("r",3).attr("fill","#fff").attr("stroke",s.col).attr("stroke-width",1.5); });
    });
    svg.append("text").attr("x",m.l+4).attr("y",m.t+12).text(`from ${base}, small rings mark each doubling`).style("font-size","12px");
  } else {
    const x = d3.scaleBand().domain(c.series.map(s=>s.label)).range([m.l,W-40]).padding(0.35), y = d3.scaleLinear().domain([0,d3.max(c.series,s=>s.value)]).nice().range([H-m.b,m.t]);
    svg.append("g").attr("transform",`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickSize(0).tickPadding(8)).call(g=>g.select(".domain").attr("stroke","var(--g-rule)"));
    svg.append("g").attr("transform",`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(4).tickSize(0).tickPadding(6)).call(g=>g.select(".domain").remove());
    svg.selectAll("rect.b").data(c.series).join("rect").attr("x",s=>x(s.label)).attr("width",x.bandwidth()).attr("y",s=>y(s.value)).attr("height",s=>y(0)-y(s.value)).attr("fill",col);
    svg.selectAll("text.v").data(c.series).join("text").attr("x",s=>x(s.label)+x.bandwidth()/2).attr("y",s=>y(s.value)-6).attr("text-anchor","middle").style("font-size","12px").text(s=>`${s.value}${c.unit||""}`);
  }
  const figSpan = chartFigSpan(c), df = host.querySelector(".srcfig");
  if(figSpan && figSpan.figure && figSpan.figure.local){ df.innerHTML = `<img src="${esc(figSpan.figure.local)}" alt="the source's figure"><div><b style="color:var(--g-ink)">Based on the source's own figure.</b> Click the chart or the thumbnail for the figure, its caption, and the passage the numbers come from.</div>`; }
  else df.innerHTML = `<div><b style="color:var(--g-ink)">Based on a passage, not a figure.</b> Click the chart for the passage the numbers come from.</div>`;
  const openFig = ()=>{ const was = host.classList.contains("open"); closeSide(); if(!was) openFigSide(host, c, figSpan); };
  host.querySelector(".csvg").style.cursor = "pointer"; host.querySelector(".csvg").addEventListener("click",openFig);
  df.style.cursor = "pointer"; df.addEventListener("click",openFig);
  if(state.openFig===i){ document.querySelectorAll(".side").forEach(e=>e.remove()); openFigSide(host, c, figSpan); }
}
function openFigSide(host, c, figSpan){
  const sp = spanOf(c.span), src = srcOf(sp), co = colourOf(sp);
  host.classList.add("open"); state.open = c.span; state.openFig = CHARTS.indexOf(c);
  const side = document.createElement("div"); side.className="side"; side.style.setProperty("--c",co.c); side.style.setProperty("--t",co.t);
  const f = figSpan && figSpan.figure;
  const nums = (sp.text||"").replace(/(\d+(?:\.\d+)?)/g,"\u0001$1\u0002");
  const marked = esc(nums).replace(/\u0001/g,"<mark>").replace(/\u0002/g,"</mark>");
  side.innerHTML = `<button class="close" title="close">×</button>
    <div class="where"><b>What this chart is based on.</b> ${esc(src.author)}, <i>${esc(src.title)}</i> (${esc(String(src.year))}) · ${esc(sp.locator||"")}${sp.page?` · p. ${esc(String(sp.page))}`:""}</div>
    ${f && f.local ? `<div class="fig"><a href="${esc(f.local)}" target="_blank"><img src="${esc(f.local)}" alt="the source's figure"></a></div><div class="ctx" style="margin-top:6px"><p>${esc(f.caption||"")}${f.line?` <span style="color:var(--g-secondary)">(caption at line ${f.line})</span>`:""}</p></div>` : `<div class="ctx"><p>No extracted image for a figure this passage names.</p></div>`}
    <div class="where" style="margin-top:10px">The numbers are taken from this passage, line ${sp.line} of the converted text:</div>
    <div class="ctx"><p>${marked}</p></div>
    <div class="verify">${origButton(sp,src)}${convLink(sp,src)}<button class="more">provenance ▸</button></div>
    <div class="stack">${stackRows(sp,src)}</div>`;
  side.querySelector(".more").addEventListener("click",e=>{ const s=side.querySelector(".stack"); s.classList.toggle("show"); e.target.textContent = s.classList.contains("show")?"provenance ▾":"provenance ▸"; });
  side.querySelector(".close").addEventListener("click",closeSide);
  const fob = side.querySelector(".orig"); if(fob) fob.addEventListener("click",()=>window.openViewer(sp, src));
  const margin = document.getElementById("margin");
  if(getComputedStyle(margin).display!=="none"){ margin.appendChild(side); side.style.top = Math.max(0, host.getBoundingClientRect().top - margin.getBoundingClientRect().top)+"px"; }
  else { side.classList.add("inline"); host.after(side); }
}

function renderTrace(){
  let placed=0, para=0, lic=0, missing=0;
  for(const id of Object.keys(BUNDLE.spans)){ const m=modeOf(id); if(m.m==="verbatim") placed++; else if(m.m==="missing") missing++; else { para++; if(m.why==="licence") lic++; } }
  document.getElementById("trace").innerHTML = `${esc(REPORT.trace)} · <code>spans: ${placed} placed, ${para} paraphrased (${lic} by licence), ${missing} missing · --verbatim ${state.verbatim.toFixed(2)} --joins ${state.joins} --context ${state.ctx}</code>`;
}

document.getElementById("verb").addEventListener("input",e=>{ state.verbatim=+e.target.value; document.getElementById("verbval").textContent=state.verbatim.toFixed(2); renderArticle(); renderCoverage(); renderInk(); renderTrace(); });
document.getElementById("joins").addEventListener("change",e=>{ state.joins=e.target.value; renderArticle(); renderCoverage(); renderInk(); renderTrace(); });
document.getElementById("ctx").addEventListener("change",e=>{ state.ctx=e.target.value; if(state.open){ const el=document.querySelector(`.v[data-id="${state.open}"]`); closeSide(); if(el) openSide(el);} renderTrace(); });
document.getElementById("ship").addEventListener("change",e=>{ state.ship=e.target.checked; renderArticle(); renderCoverage(); renderInk(); renderTrace(); });
document.getElementById("passages").addEventListener("change",e=>{ state.passages=e.target.checked; renderArticle(); renderCoverage(); renderInk(); renderTrace(); });
window.addEventListener("resize",()=>{ renderSourceMap(); if(state.open){ const el=document.querySelector(`.v[data-id="${state.open}"]`); closeSide(); if(el) openSide(el);} });
document.getElementById("verb").value = state.verbatim; document.getElementById("verbval").textContent = (+state.verbatim).toFixed(2);
document.getElementById("joins").value = state.joins; document.getElementById("ctx").value = state.ctx; document.getElementById("ship").checked = !!state.ship; document.getElementById("passages").checked = !!state.passages;
render();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>renderSourceMap());
</script>
</body>
</html>
