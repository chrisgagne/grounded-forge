<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verbatim report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;1,400&family=Archivo+Narrow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="vendor/d3.v7.min.js"></script>
<style>
:root{
  --g-ground:#FFFFFF; --g-ink:#1D2328; --g-secondary:#4A545E; --g-rule:#D5DAE0;
  --g-action:#1F4BB0; --g-action-hover:#163A8C;
  --g-cat-1:#9A5B00; --g-cat-1-tint:#FCEFD9;   /* a copyrighted-ceiling corpus */
  --g-cat-2:#6B4BA6; --g-cat-2-tint:#EEE9F7;   /* an open-nc-ceiling corpus */
  --g-cat-3:#0F6E78; --g-cat-3-tint:#DEF0F2;
  --g-hatch:repeating-linear-gradient(135deg, var(--g-ink) 0 1px, transparent 1px 7px);
  --font-body:"Archivo",Arial,sans-serif; --font-display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --measure:760px; --margin:340px; --gap:48px;
}
*{box-sizing:border-box}
html{background:var(--g-ground)}
body{margin:0;color:var(--g-ink);font-family:var(--font-body);font-size:19px;line-height:1.64;background:var(--g-ground)}
a{color:var(--g-action)} a:hover{color:var(--g-action-hover)}
.page{max-width:calc(var(--measure) + var(--gap) + var(--margin));margin:0 auto;padding:40px 20px 120px}
header{border-top:3px solid var(--g-ink);padding-top:14px;margin-bottom:28px}
.kicker{font-family:var(--font-display);font-size:16px;letter-spacing:.02em;color:var(--g-secondary);text-transform:uppercase}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(34px,5vw,58px);line-height:1.08;margin:6px 0 14px;max-width:var(--measure)}
.meta{font-size:16px;color:var(--g-secondary);max-width:var(--measure)}
.flags{display:flex;flex-wrap:wrap;gap:22px 36px;align-items:center;font-size:16px;color:var(--g-secondary);border-top:1px solid var(--g-rule);border-bottom:1px solid var(--g-rule);padding:12px 0;margin:22px 0 6px}
.flags code{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--g-ink)}
.flags label{display:inline-flex;align-items:center;gap:10px}
.flags input[type=range]{width:160px;accent-color:var(--g-action)}
.flags select{font:inherit;font-size:15px;color:var(--g-ink);border:1px solid var(--g-rule);background:#fff;padding:2px 6px;border-radius:3px}
.flags input[type=checkbox]{accent-color:var(--g-action);width:16px;height:16px}
.key{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:15px;color:var(--g-secondary);margin:10px 0 0}
.key .sw{display:inline-block;width:38px;height:0;border-bottom:2px solid;vertical-align:middle;margin-right:8px}
.key .sw.dash{border-bottom-style:dashed}
.key .sw.hatch{height:10px;border:0;background:var(--g-hatch)}

/* figures row */
.figures{display:grid;grid-template-columns:1fr;gap:34px 40px;margin:34px 0 10px}
@media (min-width:1180px){.figures{grid-template-columns:minmax(0,1fr) 360px}.figures .wide{grid-column:1 / -1}}
figure{margin:0}
figcaption{font-size:16px;line-height:1.5;color:var(--g-secondary);max-width:500px;margin-top:6px}
figcaption b{color:var(--g-ink);font-weight:600}
.figtitle{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--g-ink);margin:0 0 4px}
svg text{font-family:var(--font-body);fill:var(--g-secondary);font-size:14px}
svg text.ink{fill:var(--g-ink)}
svg text.narrow{font-family:var(--font-display)}
.hero{font-family:var(--font-display);font-weight:600;font-size:64px;line-height:1;color:var(--g-ink);margin:0}
.hero small{display:block;font-family:var(--font-body);font-weight:400;font-size:16px;color:var(--g-secondary);line-height:1.5;margin-top:4px;max-width:360px}
.strip{display:flex;height:12px;margin:14px 0 6px;gap:2px}
.strip div{height:100%;min-width:0}
.striplabels{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--g-secondary)}
.striplabels .sw{display:inline-block;width:14px;height:10px;vertical-align:-1px;margin-right:6px}

/* body grid */
.body{position:relative;display:grid;grid-template-columns:minmax(0,var(--measure));gap:var(--gap)}
@media (min-width:1180px){.body{grid-template-columns:var(--measure) var(--margin)}}
article{max-width:var(--measure)}
article p{max-width:600px;margin:0 0 1.1em}
h2{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,3vw,34px);line-height:1.15;margin:1.5em 0 .5em;max-width:600px}
.note{font-size:16px;color:var(--g-secondary);border-left:3px solid var(--g-rule);padding:2px 0 2px 16px;max-width:600px;margin:0 0 1.5em}
.margin{position:relative;display:none}
@media (min-width:1180px){.margin{display:block}}

/* placed spans: a quote wears quotation marks and a standing tint; a paraphrase is italic with a visible tag */
.v{cursor:pointer;border-bottom:1.5px solid var(--c);padding-bottom:1px;transition:background .15s}
.v.q{background:var(--t);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.v.q::before{content:"\201C"}
.v.q::after{content:"\201D"}
.v:hover,.v.open{background:var(--t);filter:saturate(1.6)}
.v.open{border-bottom-width:2.5px}
.v sup{font-family:var(--font-display);font-size:11px;color:var(--g-secondary);margin-left:2px;letter-spacing:.02em;font-style:normal}
.v.para{border-bottom-style:dashed;font-style:italic;background:none}
.v.para .tag{font-family:var(--font-display);font-style:normal;font-size:12px;color:var(--g-secondary);border:1px solid var(--g-rule);border-radius:3px;padding:0 4px;margin-left:5px;vertical-align:1px;letter-spacing:.02em}
.v.missing{border-bottom:0;background:var(--g-hatch);background-size:100% 6px;background-repeat:no-repeat;background-position:0 100%;font-style:italic}
.v.missing .tag{font-family:var(--font-display);font-style:normal;font-size:12px;color:var(--g-secondary);border:1px solid var(--g-ink);border-radius:3px;padding:0 4px;margin-left:5px;vertical-align:1px}

/* sidenote: the quote in its own paragraph of source */
.side{position:absolute;left:0;width:var(--margin);font-size:15px;line-height:1.5;color:var(--g-ink);border-top:2px solid var(--c);padding-top:8px;background:var(--g-ground)}
.side.inline{position:static;width:auto;max-width:600px;margin:0 0 1.4em;padding:10px 0 0}
.side .where{font-family:var(--font-display);font-size:15px;color:var(--g-secondary);margin-bottom:6px}
.side .where b{color:var(--g-ink);font-weight:600}
.side .ctx{color:var(--g-secondary);max-height:420px;overflow:auto}
.side .ctx mark{background:var(--t);color:var(--g-ink);box-shadow:0 0 0 2px var(--t);border-radius:2px}
.side .ctx p{margin:0 0 .7em;max-width:none}
.side .verify{margin:8px 0 0;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 16px}
.side .verify button[disabled]{color:var(--g-secondary);text-decoration:none;cursor:not-allowed;opacity:.55}
.side .verify a,.side .verify button{font:inherit;color:var(--g-action);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.side .stack{margin-top:10px;border-top:1px solid var(--g-rule);padding-top:8px;display:none}
.side .stack.show{display:block}
.side .row{display:grid;grid-template-columns:86px 1fr;gap:8px;font-size:13.5px;line-height:1.45;padding:5px 0;border-bottom:1px solid var(--g-rule)}
.side .row .k{font-family:var(--font-display);color:var(--g-secondary);font-size:14px}
.side .row .k b{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--g-ink);border:1px solid var(--g-rule);border-radius:3px;padding:0 4px;margin-left:4px}
.side .row .p{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--g-secondary);display:block;word-break:break-all}
.side .row .t{color:var(--g-ink)}
.side .fig img{max-width:100%;border:1px solid var(--g-rule);margin-top:6px}
.side .close{float:right;font:inherit;color:var(--g-secondary);background:none;border:0;cursor:pointer;font-size:18px;line-height:1;padding:0 2px}
.cmd{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--g-secondary);background:#F5F6F8;padding:4px 6px;border-radius:3px;display:block;margin-top:6px;white-space:pre-wrap;word-break:break-all}

/* chart in the article */
.chart{margin:10px 0 24px;max-width:var(--measure)}
.chart .wrap{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.chart .wrap{grid-template-columns:1fr 200px}}
.chart .srcfig img{width:100%;border:1px solid var(--g-rule)}
.chart .srcfig{font-size:14px;color:var(--g-secondary);line-height:1.45}
.tip{position:fixed;pointer-events:none;background:var(--g-ink);color:#E6E8EC;font-size:13px;line-height:1.4;padding:6px 9px;border-radius:3px;max-width:320px;display:none;z-index:9}

/* original viewer */
.viewer{position:fixed;inset:0;background:rgba(29,35,40,.55);z-index:20;display:none}
.viewer.show{display:block}
.vpanel{position:absolute;top:24px;bottom:24px;left:50%;transform:translateX(-50%);width:min(1100px,calc(100vw - 40px));background:var(--g-ground);border-top:3px solid var(--g-ink);display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.vbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--g-rule);font-size:15px;color:var(--g-secondary)}
.vbar b{color:var(--g-ink);font-family:var(--font-display);font-size:17px;font-weight:600}
.vbar button{font:inherit;font-size:15px;color:var(--g-action);background:none;border:1px solid var(--g-rule);border-radius:3px;padding:3px 10px;cursor:pointer}
.vbar button:hover{border-color:var(--g-action)}
.vbar .x{margin-left:auto;border:0;font-size:22px;line-height:1;color:var(--g-secondary)}
.vbar .status{font-size:14px;flex-basis:100%}
.vbody{flex:1;overflow:auto;background:#EEF0F3;position:relative}
#pdfhost{position:relative;margin:16px auto;box-shadow:0 2px 12px rgba(0,0,0,.18);background:#fff}
#pdfhost canvas{display:block}
.textLayer{position:absolute;inset:0;overflow:hidden;opacity:1;line-height:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
.textLayer .hl{background:var(--t,#FCEFD9);mix-blend-mode:multiply;border-radius:2px}
#pnghost{position:relative;margin:16px auto;box-shadow:0 2px 12px rgba(0,0,0,.18);background:#fff}
#pnghost img{display:block;width:100%}
#pnghost .box{position:absolute;pointer-events:none}   /* the highlight is drawn into the PNG; the box only marks where to scroll */
#epubhost{height:100%;background:#fff;margin:0 auto;max-width:900px}

footer{margin-top:48px;border-top:1px solid var(--g-rule);padding-top:12px;font-size:14px;color:var(--g-secondary);font-style:italic;max-width:var(--measure)}
footer code{font-style:normal;font-family:ui-monospace,Menlo,monospace;font-size:12px}
</style>
</head>
<body>
<div class="page">
<header>
  <div class="kicker">grounded-forge · verbatim mode</div>
  <h1 id="q"></h1>
  <div class="meta" id="meta"></div>
  <div class="flags">
    <label><code>--verbatim</code> <input type="range" id="verb" min="0" max="1" step="0.05" value="1"> <code id="verbval">1.00</code></label>
    <label><code>--joins</code> <select id="joins"><option value="essay">essay</option><option value="minimal">minimal</option></select></label>
    <label><code>--context</code> <select id="ctx"><option value="paras:1">paras:1</option><option value="chars:600">chars:600</option><option value="words:120">words:120</option><option value="pages:1">pages:1</option></select></label>
    <label><input type="checkbox" id="ship"> as it would ship <code>max_visibility: open-nc</code></label>
    <label><input type="checkbox" id="passages"> show pointed paraphrases as the author's passage</label>
  </div>
  <div class="key" id="key"></div>
</header>

<section class="figures">
  <figure class="wide">
    <div class="figtitle">Where the report draws from</div>
    <div id="sourcemap"></div>
    <figcaption>One strip per source, length by word count, chapter ticks beneath. Each dot is a span placed in this report, at its line in the converted text. Hover a dot for the passage; the colour is the corpus.</figcaption>
  </figure>
  <figure>
    <div class="figtitle">Coverage of the question</div>
    <div id="coverage"></div>
    <figcaption>Each row is a sub-claim of the answer; each column a source. A filled dot is the author's own words on the page, a ring is the model's paraphrase of them, hatching is a span the resolver could not place.</figcaption>
  </figure>
  <figure>
    <div class="figtitle">Whose words</div>
    <p class="hero" id="hero"></p>
    <div class="strip" id="strip"></div>
    <div class="striplabels" id="striplabels"></div>
    <figcaption>Words on this page by who wrote them. Moves with <code>--verbatim</code>, <code>--joins</code> and the shipping gate.</figcaption>
  </figure>
</section>

<div class="body">
  <article id="article"></article>
  <aside class="margin" id="margin"></aside>
</div>
<footer id="trace"></footer>
</div>
<div class="tip" id="tip"></div>
<div class="viewer" id="viewer"><div class="vpanel">
  <div class="vbar"><b id="vtitle"></b><span id="vwhere"></span><button id="vprev">‹ previous page</button><button id="vnext">next page ›</button><button id="vback">back to the quote</button><button class="x" id="vclose" title="close">×</button><span class="status" id="vstatus"></span></div>
  <div class="vbody" id="vbody"><div id="pnghost" hidden></div></div>
</div></div>
<script>
// ---------- original viewer: the quote highlighted on the rendered page ----------
const V = {kind:null, pdf:null, pageNo:1, hitPage:null, anchor:"", tint:"", sp:null, src:null, textCache:new Map(), book:null, rendition:null, cfi:null};
const norm = s => (s||"").replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,"-").replace(/­/g,"").replace(/ﬁ/g,"fi").replace(/ﬂ/g,"fl").replace(/\s+/g," ").toLowerCase();
const el = id => document.getElementById(id);
function vstatus(t){ el("vstatus").textContent = t; }
function closeViewer(){ el("viewer").classList.remove("show"); el("vprev").disabled=false; el("vnext").disabled=false; if(V.rendition){ try{V.rendition.destroy();}catch(e){} V.rendition=null; V.book=null; } }
el("vclose").addEventListener("click",closeViewer);
el("viewer").addEventListener("click",e=>{ if(e.target===el("viewer")) closeViewer(); });
document.addEventListener("keydown",e=>{ if(!el("viewer").classList.contains("show")) return; if(e.key==="Escape") closeViewer(); if(e.key==="ArrowRight") el("vnext").click(); if(e.key==="ArrowLeft") el("vprev").click(); });

async function openViewer(sp, src){
  if(!(sp.pages && sp.pages.length)) return;
  V.sp=sp; V.src=src; V.tint = colourOf(sp).tint;
  el("vtitle").textContent = `${src.author}, ${src.title}`; el("vwhere").textContent = sp.locator||"";
  el("viewer").classList.add("show"); el("pnghost").hidden = false; el("pnghost").style.setProperty("--t", V.tint);
  V.kind="png"; V.pages = sp.pages; V.pi = Math.max(0, sp.pages.findIndex(p=>p.n===sp.hit_page)); showPng();
}
function showPng(){
  const p = V.pages[V.pi], host = el("pnghost"); const w = Math.min(el("vbody").clientWidth-32, 880);
  host.style.width = w+"px";
  host.innerHTML = `<img src="${p.png}" alt="page ${p.n}">` + (p.boxes||[]).map(b=>`<div class="box" style="left:${(100*b[0]).toFixed(2)}%;top:${(100*b[1]).toFixed(2)}%;width:${(100*(b[2]-b[0])).toFixed(2)}%;height:${(100*(b[3]-b[1])).toFixed(2)}%"></div>`).join("");
  const hit = p.n===V.sp.hit_page, epub = V.sp.page_layout==="epub-reflow";
  el("vwhere").textContent = `${V.sp.locator||""} · ${epub?"EPUB page":"PDF page"} ${p.n}${p.folio?` · printed p. ${p.folio}`:""}${hit?" · the quote is highlighted":""}`;
  vstatus(`${epub?"The EPUB has no fixed pages; this is the book laid out at a fixed page size by the renderer, so the page number is the renderer's, not the publisher's. ":""}Pages ${V.pages[0].n} to ${V.pages[V.pages.length-1].n} are pre-rendered in this folder.`);
  el("vprev").disabled = V.pi===0; el("vnext").disabled = V.pi===V.pages.length-1;
  el("vbody").scrollTop = 0;
  const img = host.querySelector("img"), toBox = ()=>{ const b = host.querySelector(".box"); if(b) b.scrollIntoView({block:"center"}); };
  if(img.complete) toBox(); else img.addEventListener("load", toBox, {once:true});
}
el("vprev").addEventListener("click",()=>{ if(V.pi>0){ V.pi--; showPng(); } });
el("vnext").addEventListener("click",()=>{ if(V.pi<V.pages.length-1){ V.pi++; showPng(); } });
el("vback").addEventListener("click",()=>{ V.pi = Math.max(0, V.pages.findIndex(p=>p.n===V.sp.hit_page)); showPng(); });
window.openViewer = openViewer;
</script>


<script>
const REPORT = {"question": "Please draw some interesting parallels between US Marines war-fighting doctrine and modern \"textbook\" business administration.", "mode": {"verbatim": 1.0, "context": "paras:1", "protocol": "Synthesis", "lens": "none", "corpora": ["demo"], "joins": "essay"}, "coverage_note": "The demo corpus holds one military source, MCDP 1 itself, and general business textbooks, so every parallel here is drawn by setting the two side by side; no source in the corpus applies mission command, intent or manoeuvre thinking to business directly, and none speaks for the textbook tradition beyond OpenStax. The management textbook's deep reference leaves out its exercise apparatus, and only the chapters on decisions, management history, environments, strategy, structure and planning were read for this answer. Candidates that would let the corpus answer this question directly: Stephen Bungay's The Art of Action (mission command applied to business strategy and execution), Peter Drucker's The Practice of Management (the primary source for management by objectives), and Stanley McChrystal and colleagues' Team of Teams (decentralised command carried from the military into large organisations).", "subclaims": [{"id": "c1", "label": "Uncertainty: plan it away or fight through", "spans": ["mcdp-uncertainty", "pom-plan-reasons", "pom-planning-closer"]}, {"id": "c2", "label": "Intent versus cascaded goals", "spans": ["mcdp-intent-in-mission", "pom-mission-why", "pom-goal-hierarchy", "mcdp-intent-predominant"]}, {"id": "c3", "label": "Decentralise by rule or by contingency", "spans": ["mcdp-decentralize", "pom-organic", "pom-contingency", "caib-hro-both"]}, {"id": "c4", "label": "Fast and slow decision modes", "spans": ["mcdp-intuitive-analytical", "pom-two-systems", "pom-programmed-pairing", "pom-reactive-expertise", "pom-time-constraints", "mcdp-any-decision"]}, {"id": "c5", "label": "Error, blame and inaction", "spans": ["mcdp-zero-defects", "mcdp-inaction", "pom-involvement-blame", "pom-escalation", "mcdp-reinforce-failure"]}, {"id": "c6", "label": "Doctrine is not a framework", "spans": ["mcdp-doctrine-procedures", "pom-merton-absolutes", "ot-framework-pitch"]}], "rank": ["mcdp-intent-predominant", "pom-goal-hierarchy", "mcdp-decentralize", "pom-organic", "caib-hro-both", "mcdp-uncertainty", "pom-planning-closer", "mcdp-intuitive-analytical", "pom-programmed-pairing", "mcdp-zero-defects", "pom-involvement-blame", "mcdp-doctrine-procedures", "pom-merton-absolutes"], "sections": [{"heading": "Both start from not knowing", "joins": ["Both traditions begin with the same problem: how to act when nobody can know what will happen next. MCDP 1 sets out its starting point: ", {"span": "mcdp-uncertainty", "source": "00q", "anchor": "Because we can never eliminate uncertainty, we must learn to fight", "sentences": 2, "paraphrase": "MCDP 1 holds that uncertainty can never be removed, so Marines must fight well despite it, through simple, flexible plans, contingency planning, standing procedures and initiative among subordinates."}, " The management textbook comes at the same problem through planning: ", {"span": "pom-plan-reasons", "source": "00j", "show": "paraphrase", "anchor": "Managers have several reasons for formulating plans for themselves, their employees", "sentences": 1, "paraphrase": "The management textbook lists offsetting uncertainty and change as the first of five reasons managers plan, ahead of focus, a road map, efficiency and control."}, " For a manager, the practical question is whether initiative sits inside the answer to uncertainty or outside it. Once the environment turns rough, the textbook moves the work down to where it happens: ", {"span": "pom-planning-closer", "source": "00j", "anchor": "planning and controlling move closer to the point in the organization", "sentences": 1, "paraphrase": "The management textbook observes that as uncertainty, rapid change and turbulence rise, planning and controlling shift toward the people who carry the plans out day to day."}, " Put plainly, the rougher the market, the more a business has to be run the way a Marine unit is run."], "joins_min": ["", {"span": "mcdp-uncertainty"}, " ", {"span": "pom-plan-reasons"}, " Under turbulence: ", {"span": "pom-planning-closer"}, " The rougher the market, the more a firm must run like a Marine unit."]}, {"heading": "Commander's intent and the mission statement", "joins": ["The closest match in vocabulary is between commander's intent and the business mission statement, and the two even share a document. In MCDP 1, intent travels with the mission: ", {"span": "mcdp-intent-in-mission", "source": "00q", "show": "paraphrase", "anchor": "A commander normally provides intent as part of the mission statement", "sentences": 1, "paraphrase": "MCDP 1 places the commander's intent inside the mission statement a commander hands to a subordinate."}, " The textbook gives its mission statement a similar job: ", {"span": "pom-mission-why", "source": "00j", "show": "paraphrase", "anchor": "The mission statement takes the why of a vision statement", "sentences": 1, "paraphrase": "The management textbook describes the mission statement as taking the reason behind a firm's vision and sketching broadly how the firm will pursue it."}, " The difference lies in what flows down the hierarchy after that. The textbook's version is a cascade of goals: ", {"span": "pom-goal-hierarchy", "source": "00j", "anchor": "In the process, managers must make sure that lower-level goals combine", "sentences": 1, "paraphrase": "The management textbook tells managers to make sure that goals set at each lower level add up to the goals above them."}, " MCDP 1 on the two parts of every mission: ", {"span": "mcdp-intent-predominant", "source": "00q", "anchor": "The task describes the action to be taken while the intent", "sentences": 4, "paraphrase": "MCDP 1 splits every mission into a task, which says what to do, and an intent, which says why, and ranks the intent higher because it keeps guiding action after a changed situation has made the task obsolete."}, " For a business, this is the sharpest lesson in the whole comparison. A cascaded target goes stale the moment the market moves, while a stated reason behind the target still tells a team what to do next."], "joins_min": ["Same document, different load. ", {"span": "mcdp-intent-in-mission"}, " ", {"span": "pom-mission-why"}, " What cascades differs: ", {"span": "pom-goal-hierarchy"}, " Against: ", {"span": "mcdp-intent-predominant"}, " A target goes stale when the market moves; a reason keeps guiding."]}, {"heading": "How far to push decisions down", "joins": ["Where decisions get made is where the comparison turns most practical. MCDP 1 commits to one answer: ", {"span": "mcdp-decentralize", "source": "00q", "anchor": "First and foremost, in order to generate the tempo of operations", "sentences": 2, "paraphrase": "MCDP 1 requires decentralised command, both for tempo and to cope with the disorder of combat: subordinates decide on their own initiative from their senior's intent instead of sending information up and waiting for a decision to come down."}, " The management textbook describes organic structures this way: ", {"span": "pom-organic", "source": "00j", "anchor": "these organizational forms work best in unstable, complex, changing environments", "sentences": 2, "paraphrase": "The management textbook places organic structures in unstable, complex, changing environments, with flatter hierarchies and decisions flowing in several directions."}, " That sits inside its wider stance: ", {"span": "pom-contingency", "source": "00j", "show": "paraphrase", "anchor": "The contingency school changed this by proposing that there are no universal", "sentences": 2, "paraphrase": "The management textbook presents the contingency school's view that management has no universal rules, because each situation calls for its own response."}, " There is less conflict here than it first seems: war sits at the unstable, complex end of that scale, so a fixed rule and a contingent one give the same answer there. The Columbia board adds the move a business most needs: ", {"span": "caib-hro-both", "source": "00u", "anchor": "manner when appropriate, is the hallmark of a high-reliability organization", "sentences": 1, "paraphrase": "The Columbia Accident Investigation Board names the ability to work centrally when that fits and in a decentralised way when that fits as the mark of a high-reliability organisation."}, " Most firms run a stable core and an unstable edge at once, so the skill to build is switching between the two, not picking a side."], "joins_min": ["", {"span": "mcdp-decentralize"}, " ", {"span": "pom-organic"}, " ", {"span": "pom-contingency"}, " War sits at the unstable end, so both answers agree there. ", {"span": "caib-hro-both"}, " Firms with a stable core and an unstable edge need to switch, not pick."]}, {"heading": "Fast and slow decisions, paired differently", "joins": ["Decision-making holds the most surprising contrast. MCDP 1 assigns its two modes like this: ", {"span": "mcdp-intuitive-analytical", "source": "00q", "anchor": "Decisionmaking may be an intuitive process based on experience", "sentences": 4, "paraphrase": "MCDP 1 expects intuitive, experience-based decisions at lower levels and in fluid, uncertain situations, and analytical comparison of options at higher levels or in deliberate planning."}, " The textbook's two systems look much the same at first: ", {"span": "pom-two-systems", "source": "00j", "show": "paraphrase", "anchor": "The reflective system is logical, analytical, deliberate, and methodical, while", "sentences": 1, "paraphrase": "The management textbook contrasts a reflective system that is logical and deliberate with a reactive system that is quick, intuitive and driven by emotion or habit."}, " Its default pairing, though, runs the other way: ", {"span": "pom-programmed-pairing", "source": "00j", "anchor": "Nonprogrammed decisions will generally need to be processed via the reflective system", "sentences": 2, "paraphrase": "The management textbook sends novel decisions to the slow, reflective system and keeps the quick, reactive system for routine decisions that heuristics can handle."}, " The textbook does leave a door open: ", {"span": "pom-reactive-expertise", "source": "00j", "show": "paraphrase", "anchor": "However, the reactive system can be lifesaving when time is", "sentences": 1, "paraphrase": "The management textbook grants that the reactive system can save lives when time is short and works far better when it rests on experience and expertise."}, " Put together, a novel and fast-moving situation is where the two would most often send a manager in opposite directions. Time shows the same split: ", {"span": "pom-time-constraints", "source": "00j", "show": "paraphrase", "anchor": "When there is little time available to collect information and to rationally", "sentences": 1, "paraphrase": "The management textbook lists time pressure among the barriers to good decisions, since little time to gather and weigh information makes a good novel decision much less likely."}, " ", {"span": "mcdp-any-decision", "source": "00q", "show": "paraphrase", "anchor": "If we fail to make a decision out of lack of will", "sentences": 3, "paraphrase": "MCDP 1 holds that failing to decide hands the initiative to the enemy, so as a basis for action almost any decision beats none."}, " For a business in a fast market, treating decision speed as a capability to build, rather than a pressure to endure, is the more useful stance."], "joins_min": ["", {"span": "mcdp-intuitive-analytical"}, " ", {"span": "pom-two-systems"}, " Paired the other way: ", {"span": "pom-programmed-pairing"}, " ", {"span": "pom-reactive-expertise"}, " Time, too: ", {"span": "pom-time-constraints"}, " ", {"span": "mcdp-any-decision"}, " Build decision speed; don't just endure it."]}, {"heading": "Mistakes, blame and the cost of waiting", "joins": ["Treatment of error is where a business reader may be most surprised. MCDP 1 on the mistakes of junior leaders: ", {"span": "mcdp-zero-defects", "source": "00q", "anchor": "We should deal with such errors leniently; there must be no", "sentences": 2, "paraphrase": "MCDP 1 asks leaders to treat junior leaders' errors of overboldness leniently and rejects a zero-defects mentality, so that fear of punishment does not stifle boldness or initiative."}, " It is just as firm in the other direction: ", {"span": "mcdp-inaction", "source": "00q", "show": "paraphrase", "anchor": "On the other hand, we should deal severely with errors of", "sentences": 2, "paraphrase": "MCDP 1 tells leaders to deal severely with inaction and timidity and refuses to accept a lack of orders as an excuse for doing nothing."}, " The textbook's nearest match is its involvement-oriented organisation: ", {"span": "pom-involvement-blame", "source": "00j", "anchor": "Control in high-involvement organizations is diffused through many groups and is", "sentences": 2, "paraphrase": "The management textbook describes control in high-involvement organisations as spread across many groups and aimed at getting the task done rather than blaming one person, unlike control-oriented systems where the hierarchy holds the reins and failure lands on the individual."}, " On sunk effort, the textbook warns: ", {"span": "pom-escalation", "source": "00j", "show": "paraphrase", "anchor": "progress down the wrong path isn't really progress, and they are willing", "sentences": 1, "paraphrase": "The management textbook asks managers to see that pressing on down a wrong path is not progress, and to be ready to rethink a decision and change direction."}, " MCDP 1 gives the field version: ", {"span": "mcdp-reinforce-failure", "source": "00q", "show": "paraphrase", "anchor": "when shifting the main effort, we seek to exploit success rather", "sentences": 1, "paraphrase": "MCDP 1 tells commanders who shift their main effort to move it toward what is working, not to pour more into what is failing."}, " The business lesson is that blame-free control works only if waiting carries a cost too; without that, it turns into permission to do nothing."], "joins_min": ["", {"span": "mcdp-zero-defects"}, " ", {"span": "mcdp-inaction"}, " ", {"span": "pom-involvement-blame"}, " ", {"span": "pom-escalation"}, " ", {"span": "mcdp-reinforce-failure"}, " Blame-free control needs a cost for waiting."]}, {"heading": "Doctrine is not a framework", "joins": ["The last parallel concerns what a body of rules is for. MCDP 1 states its own standing: ", {"span": "mcdp-doctrine-procedures", "source": "00q", "anchor": "Our doctrine does not consist of procedures to be applied in specific", "sentences": 2, "paraphrase": "MCDP 1 describes its doctrine as general guidance that takes judgment to apply, not a set of procedures for set situations, and so as authoritative but not prescriptive."}, " Merton, as the management textbook quotes him, saw what happens when rules lose that standing: ", {"span": "pom-merton-absolutes", "source": "00j", "anchor": "devotion to the rules leads to their transformation into absolutes; they are", "sentences": 2, "paraphrase": "The management textbook quotes Robert Merton's warning that devotion to rules hardens them into absolutes cut loose from their purposes, which blocks adaptation to conditions the rule-writers never foresaw."}, " The Org Topologies primer turns the same worry on management frameworks: ", {"span": "ot-framework-pitch", "source": "00p", "show": "paraphrase", "anchor": "This is the pitch from consulting companies big and small, and naturally", "sentences": 1, "paraphrase": "The Org Topologies primer calls the off-the-shelf management framework a consultancy pitch that tempts firms to follow the crowd rather than understand and design their own organisation."}, " For a business, the test of any playbook is whether it still lets people act well in a situation its authors did not foresee."], "joins_min": ["", {"span": "mcdp-doctrine-procedures"}, " ", {"span": "pom-merton-absolutes"}, " ", {"span": "ot-framework-pitch"}, " Test a playbook on the case its authors didn't foresee."]}], "charts": [], "trace": "Trace [Synthesis, Depth-over-breadth, lens: none, mode: project, corpus: demo]: lens-index read, lens-neutral question → concept-index topics block → topics t025, t040, t044, t049, t050, t051, t052, t055, t056 → sub-claims: uncertainty (mcdp1-warfighting, openstax-principles-management), intent versus cascaded goals (mcdp1-warfighting, openstax-principles-management), decentralisation (mcdp1-warfighting, openstax-principles-management, caib-report-vol1), decision modes (mcdp1-warfighting, openstax-principles-management), error and blame (mcdp1-warfighting, openstax-principles-management), doctrine versus framework (mcdp1-warfighting, openstax-principles-management, org-topologies-primer-2025) → light ref: openstax-principles-management → deep refs: mcdp1-warfighting (full), openstax-principles-management (PARTIAL: thesis, Chs 1-4, 9-10, 17 read), caib-report-vol1 and org-topologies-primer-2025 (searched to the passage) → 25 anchors (13 quotations, 12 pointed paraphrases) checked against sources/converted, all found once, none replaced", "sources": {"00q": {"slug": "mcdp1-warfighting", "corpus": "demo", "converted": "sources/converted/mcdp1-warfighting.md", "short": "MCDP 1"}, "00j": {"slug": "openstax-principles-management", "corpus": "demo", "converted": "sources/converted/openstax-principles-management.md", "short": "OpenStax PoM"}, "00u": {"slug": "caib-report-vol1", "corpus": "demo", "converted": "sources/converted/caib-report-vol1.md", "short": "CAIB"}, "00p": {"slug": "org-topologies-primer-2025", "corpus": "demo", "converted": "sources/converted/org-topologies-primer-2025.md", "short": "Org Topologies"}}};

ain=1", "served": null}, "00p": {"slug": "org-topologies-primer-2025", "corpus": "demo", "short": "Org Topologies", "title": "Strategic Org Design: The Primer", "author": "Alexey Krivitsky, Craig Larman & Roland Flemm", "year": 2025, "scope": "open-nc", "licence": "CC BY-NC-SA 4.0", "original": "sources/original/org-topologies-primer-2025.pdf", "original_via": "file name", "converted": "sources/converted/org-topologies-primer-2025.md", "lines": 1964, "words": 8156, "chapters": [], "refs": {"deep": "references/org-topologies-primer-2025-deep.md", "light": "references/org-topologies-primer-2025.md", "distillations": {"aar": "distillations/aar/org-topologies-primer-2025-aar.md", "decision-making": "distillations/decision-making/org-topologies-primer-2025-decision-making.md", "retro": "distillations/retro/org-topologies-primer-2025-retro.md", "software-business": "distillations/software-business/org-topologies-primer-2025-software-business.md", "stakeholder-engagement": "distillations/stakeholder-engagement/org-topologies-primer-2025-stakeholder-engagement.md"}}, "converted_local": "https://github.com/chrisgagne/grounded-forge/blob/main/corpus.commons/demo/sources/converted/org-topologies-primer-2025.md?plain=1", "served": null}}, "spans": {"mcdp-uncertainty": {"source": "00q", "corpus": "demo", "status": "exact", "verified": true, "hits": 1, "text": "Because we can never eliminate uncertainty, we must learn to fight effectively despite it. We can do this by developing simple, flexible plans; planning for likely contingencies; de-veloping standing operating procedures; and fostering initia-tive among subordinates.", "anchor": "Because we can never eliminate uncertainty, we must learn to fight", "line": 361, "locator": "MCDP 1", "page": 8, "context": {"before": "Warfighting\n\nMCDP 1", "after": "nonlinearity. Here the term does not refer to formations on the battlefield but describes systems in which causes and ef- fects are disproportionate. Minor incidents or actions can have decisive effects. Outcomes of battles can hinge on the actions of a few individuals, and as Clausewitz observed, \"is- sues can be decided by chances and incidents so minute as to figure in histories simply as anecdotes.\"6\n\nBy its nature, uncertainty invariably involves the estima- tion and acceptance of risk. Risk is inherent in war and is in- volved in every mission. Risk is equally common to action and inaction. Risk may be related to gain; greater potential gain often requires greater risk. The practice of concentrating combat power toward the main effort necessitates the willing- ness to accept prudent risk elsewhere. However, we should clearly understand that the acceptance of risk does not equate to the imprudent willingness to gamble the entire likelihood of success on a single improbable event. Part of uncertainty is the ungovernable element of chance. Chance is a universal characteristic of war and a continuous", "lead": "", "tail": "One important source of uncertainty is a property known as"}, "layers": {"deep": {"path": "references/mcdp1-warfighting-deep.md", "line": 36, "text": "2. **Friction, uncertainty, fluidity, disorder, and danger are *constitutive* of war, not exceptions to be engineered away.** Friction, which Clausewitz described as *\"the force that makes the apparently easy so difficult\"* [BT], is the first of the attributes Ch 1 treats: *\"Friction is the force that resists all action and saps energy. It makes the simple difficult and the difficult seemingly impossible.\"* [V] (Ch 1", "marker": "BT", "match": "2 of 2 keywords"}, "light": {"path": "references/mcdp1-warfighting.md", "line": 24, "text": "- **Ch 1 The Nature of War.** War as *Zweikampf*: a violent struggle between two hostile, independent, irreconcilable wills. Friction, uncertainty (including nonlinearity), fluidity, disorder, and complexity as inherent attributes of war that can be operated within but never eliminated. The human dimension (will, fear, courage, cohesion). Violence and danger. Physical, moral, and mental forces, with the moral and men", "marker": null, "match": "2 of 2 keywords"}, "distillations": [{"path": "distillations/aar/mcdp1-warfighting-aar.md", "line": 13, "text": "The paragraph gives an AAR facilitator a timing rule (straight after the event, and after successes as well as failures), a climate rule (open, all hands, with the senior person's tolerance of mistakes setting how much gets admitted), and a focus rule (why each action was taken and why it had the result it did, over a list of what was done). Three other parts of the source carry the rest of the projection. Ch 3 \"Prof", "marker": "V", "match": "1 of 2 keywords", "task": "aar"}, {"path": "distillations/decision-making/mcdp1-warfighting-decision-making.md", "line": 11, "text": "Around that core the pamphlet supplies the rest of a decision system. Ch 1 sets the conditions: uncertainty cannot be removed, all action rests on incomplete, inaccurate or contradictory information, and risk attaches to inaction as much as to action (Ch 1, \"Uncertainty\"). Ch 4 answers *who decides* (decentralised command, mission tactics, commander's intent) and *what gets priority* (main effort, with prudent risk a", "marker": null, "match": "1 of 2 keywords", "task": "decision-making"}, {"path": "distillations/software-business/mcdp1-warfighting-software-business.md", "line": 11, "text": "MCDP 1 gives an engineering leader a vocabulary for commanding work under uncertainty without trying to control every step of it. Four of its ideas land where engineering capacity meets commercial commitment. Every mission has a task and an intent, and the intent governs because it outlasts the task (Ch 4, \"Commander's intent\"). One action is named the main effort and gets priority for support, which means strict eco", "marker": "AR", "match": "1 of 2 keywords", "task": "software-business"}, {"path": "distillations/stakeholder-engagement/mcdp1-warfighting-stakeholder-engagement.md", "line": 21, "text": "3. <!-- concept: mission-tactics --> **The mission as a contract.** Mission tactics assigns a mission without specifying how it must be accomplished, and \"relies on a subordinate's exercise of initiative framed by proper guidance and understanding\" [V]. The senior still sets limits: \"The senior prescribes the method of execution only to the degree that is essential for coordination. The senior intervenes in a subordi", "marker": "V", "match": "1 of 2 keywords", "task": "stakeholder-engagement"}]}, "figure": null, "show": "quote", "hit_page": 17, "pages": [{"n": 17, "png": "pages/00q-17-mcdp-uncertainty.png", "boxes": [[0.18236073593973387, 0.15927958742157897, 0.9088660930848496, 0.18603479756022595], [0.1492042384961459, 0.18308255659928838, 0.38776198111286453, 0.21104294197745127]], "folio": 8}], "page_layout": "pdf", "page_check": {"checked": true, "differences": [{"quote": "de veloping", "page": "developing", "corrected": true}, {"quote": "initia tive", "page": "initiative", "corrected": true}]}, "page_via": "the folio printed on the PDF page"}, "pom-plan-reasons": {"source": "00j", "corpus": "demo", "status": "exact", "verified": true, "hits": 1, "text": "Managers have several reasons for formulating plans for themselves, their employees, and various organizational units: (1) to offset uncertainty and change; (2) to focus organizational activity on a set of objectives; (3) to provide a coordinated, systematic road map for future activities; (4) to increase economic efficiency; and (5) to facilitate control by establishing a standard for later activity.", "anchor": "Managers have several reasons for formulating plans for themselves, their employees", "line": 24529, "locator": "Ch 17, Organizational Planning and Controlling", "page": 488, "context": {"before": "Planning for organizational events, whether in the internal or external environment, should be an ongoing process—part of a manager’s daily, weekly, and monthly duties and a routine task for all members of high- involvement organizations. Plans should be continually monitored. Managers and other organizational members should check to see if their plans need to be modified to accommodate changing conditions, new information, or new situations that will affect the organization’s future. Plans need to be administered with flexibility, as organizations learn about new and changing conditions. Clearly, the Calico Candy Company failed to monitor its plans in this way. By thinking of planning as a continuous activity, methods can be formulated for handling emerging and unforeseen opportunities and threats. Planning is one process through which organizational activity can be given meaning and direction.\n\nWhy Should Managers Plan?", "after": "Several forces contribute to the necessity for organizational planning. First, in the internal environment, as organizations become larger and more complex, the task of managing becomes increasingly complex. Planning maps out future activities in relation to other activities in the organization. Second, as the external environment becomes increasingly complex and turbulent, the amount of uncertainty faced by a manager increases. Planning enables organizations to approach their environment systematically.\n\nA study out of Cornell University and Indiana University found that absenteeism cost companies $40 billion per year; the absence of planning was one of the biggest problems businesses face. Firms that follow a clearly defined plan in their day-to-day operations will be more successful than those that do not. The authors state, “organizational controlled consequences that would tend to deter absenteeism.” Interestingly, this may be as simple as inspecting the organizational policies that provide the “rules” for employee absenteeism.5", "lead": "", "tail": ""}, "layers": {"deep": {"path": "references/openstax-principles-management-deep.md", "line": 14, "text": "Principles of Management is presented as a traditional introductory management text organised around the **leading, planning, organising, and controlling** functions, with the stated purpose of addressing two themes: the variables that affect how, when, where, and why managers perform their jobs, and the theories and techniques that successful managers use across organisational levels to achieve and exceed objectives", "marker": "AR", "match": "1 of 3 keywords"}, "light": {"path": "references/openstax-principles-management.md", "line": 38, "text": "Three globalisation factors: trade-barrier reductions (WTO with 164 members), foreign direct investment ($1.52 trillion 2017), and the Internet (3.8 billion users). Hofstede's IBM-employee survey (88,000 employees, 72 countries) yielded four dimensions: power distance, individualism vs collectivism, uncertainty avoidance, masculinity. The GLOBE project (17,000 managers, 62 countries) added performance orientation and", "marker": null, "match": "1 of 3 keywords"}, "distillations": [{"path": "distillations/decision-making/openstax-principles-management-decision-making.md", "line": 10, "text": "Beyond Ch 2, decision-making is a recurring component of organisational processes addressed throughout the book. The history chapter (Ch 3) presents Mary Parker Follett's three conflict-resolution paths — dominance, compromise, integration — as foundational decision-making vocabulary, and contrasts Taylor's and Fayol's prescriptive approaches with Woodward's contingency-school \"it depends\". The strategic-analysis and", "marker": null, "match": "1 of 3 keywords", "task": "decision-making"}, {"path": "distillations/retro/openstax-principles-management-retro.md", "line": 22, "text": "6. <!-- concept: self-determination-theory --> **Self-determination theory (SDT)** — intrinsic motivation requires competence, autonomy, and relatedness. The signature SDT claim: \"as the level of extrinsic rewards increases, the amount of intrinsic motivation decreases\" [V] (Ch 14.2, \"Self-Determination Theory\"). Retro experiments assigned rather than chosen produce lower follow-through; experiments the team designs ", "marker": "V", "match": "1 of 3 keywords", "task": "retro"}, {"path": "distillations/software-business/openstax-principles-management-software-business.md", "line": 30, "text": "8. <!-- concept: pdca-and-mbo --> **The Deming/Shewhart cycle (PDCA) and MBO.** Plan → Do → Check → Act integrates organisational learning into planning, ensuring continuous improvement rather than implement-and-forget. Management by Objectives is the participatory goal-setting and management technique grounded in goal theory. The text contrasts control-oriented (top-down, tight monitoring) with involvement-oriented ", "marker": "V", "match": "1 of 3 keywords", "task": "software-business"}, {"path": "distillations/stakeholder-engagement/openstax-principles-management-stakeholder-engagement.md", "line": 58, "text": "| Identify standing | Who is affected by this decision or initiative — employees, customers, suppliers, shareholders, regulators, communities, future generations? Whose interests should be considered even if they have not yet asserted themselves? |", "marker": null, "match": "2 of 3 keywords", "task": "stakeholder-engagement"}]}, "figure": null, "show": "paraphrase", "hit_page": 503, "pages": [{"n": 503, "png": "pages/00j-503-pom-plan-reasons.png", "boxes": [[0.11764705882352941, 0.3530568209561435, 0.8027352725758272, 0.3685340881347656], [0.11764705882352941, 0.370102275501598, 0.8285147473703023, 0.38557954268022016], [0.11764705882352941, 0.38714773004705255, 0.8498382568359375, 0.40262499722567474], [0.11764705882352941, 0.4041931845925071, 0.6715147230360243, 0.41967045177112927]], "folio": 489}], "page_layout": "pdf"}, "pom-planning-closer": {"source": "00j", "corpus": "demo", "status": "exact", "verified": true, "hits": 1, "text": "As organizations confront increasing environmental or technology-induced uncertainty, rapid environmental change, and turbulence, planning and controlling move closer to the point in the organization where the plans are implemented and carried out on a day-to-day basis.", "anchor": "planning and controlling move closer to the point in the organization", "line": 25913, "locator": "Ch 17.7 • Management by Objectives: A Planning and Control Technique", "page": 517, "context": {"before": "Upper-level managers assume responsibility for planning and controlling their units while employees assume the right and responsibility for planning and controlling at their job level. As upper-level managers carry out their planning and controlling activities, they do so by soliciting input from those below them in the organizational hierarchy.\n\nSystems such as MBO are much more likely to characterize the planning and controlling process in involvement-oriented organizations than in control-oriented organizations. Control in high-involvement organizations is diffused through many groups and is commonly focused on task accomplishment and overcoming obstacles, with a de-emphasis on fixing blame with a particular individual for performance failures. In many control-oriented management systems, the reins of control are firmly held by the hierarchy, and the activities of individuals are carefully controlled. Performance failures, therefore, tend to become focused on the individual who fails to perform.", "after": "CONCEPT CHECK\n\n518     17 • Organizational Planning and Controlling", "lead": "Finally, mechanistic organizations are more likely to create large planning departments and to centralize the planning function with specialists.", "tail": "In place of hierarchy- based control, organizations rely more on professional employees and groups of employees to control their own actions as they execute organizational plans."}, "layers": {"deep": {"path": "references/openstax-principles-management-deep.md", "line": 14, "text": "Principles of Management is presented as a traditional introductory management text organised around the **leading, planning, organising, and controlling** functions, with the stated purpose of addressing two themes: the variables that affect how, when, where, and why managers perform their jobs, and the theories and techniques that successful managers use across organisational levels to achieve and exceed objectives", "marker": "AR", "match": "3 of 3 keywords"}, "light": {"path": "references/openstax-principles-management.md", "line": 7, "text": "**Structure:** 18 chapters covering managerial work, decision-making, history of management thought, organisational environments and culture, ethics and CSR, international management, entrepreneurship, strategic analysis, the strategic management process, structure and change, HR, diversity, leadership, motivation, teams, communication, planning and controlling, technology and innovation. Coverage: substantive sectio", "marker": null, "match": "2 of 3 keywords"}, "distillations": [{"path": "distillations/aar/openstax-principles-management-aar.md", "line": 12, "text": "1. <!-- concept: pdca-cycle --> **PDCA / Deming-Shewhart cycle.** Plan → Do → Check → Act → return to Plan; the AAR occupies the Check step and feeds the next Plan. Without the Act step, AAR output is stranded. (Source: Bright et al., *Principles of Management*, Ch 17.2, \"Planning, Implementation, and Controlling\")", "marker": null, "match": "2 of 3 keywords", "task": "aar"}, {"path": "distillations/decision-making/openstax-principles-management-decision-making.md", "line": 8, "text": "OpenStax's Principles of Management dedicates Chapter 2 to managerial decision-making, treating it as a core managerial activity ranging from small daily choices to strategic organisational moves. The text grounds decision-making in dual-system cognitive theory — a reflective system (logical, analytical, deliberate) and a reactive system (quick, impulsive, intuitive) — and argues that effective managers learn which s", "marker": null, "match": "3 of 3 keywords", "task": "decision-making"}, {"path": "distillations/retro/openstax-principles-management-retro.md", "line": 12, "text": "1. <!-- concept: pdca-cycle --> **PDCA / Deming-Shewhart cycle** — Plan → Do → Check → Act → return to Plan; the retro occupies the Check step and feeds Act (Ch 17.2, \"Planning, Implementation, and Controlling\"). Without a named Act step, the retro is Check without consequence.", "marker": null, "match": "2 of 3 keywords", "task": "retro"}, {"path": "distillations/software-business/openstax-principles-management-software-business.md", "line": 8, "text": "OpenStax's Principles of Management is the corpus's primary supply of management primitives where the *business* side of a software-business question turns on classical management discipline rather than on engineering empirics. The text covers strategic positioning (SWOT, PESTEL, Porter's Five Forces, VRIO, generic strategies), the strategic management cycle, ethics and CSR, international management (Hofstede, GLOBE,", "marker": null, "match": "2 of 3 keywords", "task": "software-business"}, {"path": "distillations/stakeholder-engagement/openstax-principles-management-stakeholder-engagement.md", "line": 10, "text": "The book extends stakeholder engagement through the leading-planning-organising-controlling architecture. Chapter 2 names stakeholders explicitly within the decision-making chapter. Chapter 6 (international management) develops cross-cultural stakeholder engagement through Hofstede's four cultural dimensions, the GLOBE framework, and cultural intelligence. Chapter 13 (leadership) frames followers as the \"most critica", "marker": "V", "match": "2 of 3 keywords", "task": "stakeholder-engagement"}]}, "figure": null, "show": "quote", "hit_page": 532, "pages": [{"n": 532, "png": "pages/00j-532-pom-planning-closer.png", "boxes": [[0.3556765388039982, 0.6582387288411459, 0.8765736498863869, 0.673715996019768], [0.11764705882352941, 0.6752841063220092, 0.8815442253561581, 0.6907613735006313], [0.11764705882352941, 0.6923295608674637, 0.7318825815238205, 0.7078068280460859]], "folio": 518}], "page_layout": "pdf", "page_check": {"checked": true, "differences": []}}, "mcdp-intent-in-mission": {"source": "00q", "corpus": "demo", "status": "exact", "verified": true, "hits": 1, "text": "A commander normally provides intent as part of the mission statement assigned to a subordinate.", "anchor": "A commander normally provides intent as part of the mission statement", "line": 2909, "locator": "COMMANDER'S INTENT", "page": 89, "context": {"before": "The Conduct of War\n\nCOMMANDER'S INTENT We achieve this harmonious initiative in large part through the use of the commander's intent, a device designed to help subordinates understand the larger context of their actions. The purpose of providing intent is to allow subordinates to exercise judgment and initiative—to depart from the original plan when the unforeseen occurs—in a way that is consistent with higher commanders' aims. There are two parts to any mission: the task to be accom- plished and the reason or intent behind it.° The intent is thus a part of every mission. The task describes the action to be taken while the intent describes the purpose of the action. The task denotes what is to be done, and sometimes when and where; the intent explains why. Of the two, the intent is pre- dominant. While a situation may change, making the task ob- solete, the intent is more lasting and continues to guide our actions. Understanding the intent of our commander allows us to exercise initiative in harmony with the commander's de- sires.", "after": "MCDP 1\n\nBased on the mission, the commander then develops a con- cept of operations, which explains how the unit will accom- plish the mission, and assigns missions to subordinates. Each subordinate mission statement includes an intent for that sub- ordinate. The intent provided to each subordinate should con- tribute to the accomplishment of the intent a commander has received from above. This top-down flow of intent provides consistency and continuity to our actions and establishes the context that is essential for the proper bottom-up exercise of initiative.", "lead": "The intent for a unit is established by the commander as- signing that unit's mission—usually the next higher com- mander, although not always.", "tail": "A subordinate commander who is not given a clear purpose for the assigned mission should ask for one. 89"}, "layers": {"deep": {"path": "references/mcdp1-warfighting-deep.md", "line": 145, "text": "4. Command from the front. *\"Commanders should command from where they can best influence the action, normally well forward.\"* [V] The limit: *\"command from the front should not equate to oversupervision of subordinates.\"* [V]", "marker": "V", "match": "2 of 3 keywords"}, "light": {"path": "references/mcdp1-warfighting.md", "line": 18, "text": "Licence unverified; scope open on the strength of the cover's distribution statement (see the source-integrity note).", "marker": null, "match": "1 of 3 keywords"}, "distillations": [{"path": "distillations/aar/mcdp1-warfighting-aar.md", "line": 5, "text": "**Source:** U.S. Marine Corps (1997). *MCDP 1: Warfighting*. Headquarters United States Marine Corps, Department of the Navy. Foreword signed by General C. C. Krulak, Commandant, 20 June 1997; Preface by General A. M. Gray (Ret.). PCN 142 000006 00. Supersedes FMFM 1 *Warfighting* (1989). Licence: unverified (the cover carries Distribution Statement A, \"Approved for public release; distribution is unlimited\"; the imp", "marker": null, "match": "1 of 3 keywords", "task": "aar"}, {"path": "distillations/decision-making/mcdp1-warfighting-decision-making.md", "line": 33, "text": "7. <!-- concept: commanders-intent --> **Commander's intent: the purpose outlasts the task.** Intent exists \"to allow subordinates to exercise judgment and initiative — to depart from the original plan when the unforeseen occurs — in a way that is consistent with higher commanders' aims\" [V] (Ch 4, \"Commander's intent\"). Every mission has two parts, the task (what, sometimes when and where) and the intent (why), and ", "marker": "V", "match": "2 of 3 keywords", "task": "decision-making"}, {"path": "distillations/retro/mcdp1-warfighting-retro.md", "line": 48, "text": "10. <!-- concept: commanders-intent --> **Task plus intent; the intent outlasts the task.** *\"The task describes the action to be taken while the intent describes the purpose of the action\"* [V]. *\"Of the two, the intent is predominant. While a situation may change, making the task obsolete, the intent is more lasting and continues to guide our actions\"* [V]. Intent can often be captured in an \"in order to\" phrase fo", "marker": "V", "match": "2 of 3 keywords", "task": "retro"}, {"path": "distillations/software-business/mcdp1-warfighting-software-business.md", "line": 23, "text": "1. <!-- concept: commanders-intent --> **Task and intent.** Every mission has two parts: the task says what is to be done (and sometimes when and where), the intent says why. Intent lets subordinates depart from the original plan when the unforeseen occurs, in a way consistent with the higher commander's aims. The doctrine asks for a brief, compelling statement of intent and illustrates an *in order to* form: *\"Contr", "marker": "V", "match": "2 of 3 keywords", "task": "software-business"}, {"path": "distillations/stakeholder-engagement/mcdp1-warfighting-stakeholder-engagement.md", "line": 17, "text": "1. <!-- concept: commanders-intent --> **Intent over task.** Every mission has two parts, the task to be accomplished and the intent behind it; the task says what is to be done, and the intent explains why [AP]. The doctrine ranks them: \"Of the two, the intent is predominant.\" [V] The intent outlasts a task that events have made obsolete (the full passage appears in the Worked Example). Its compact form is the *in or", "marker": "AP", "match": "2 of 3 keywords", "task": "stakeholder-engagement"}]}, "figure": null, "show": "paraphrase", "hit_page": 98, "pages": [{"n": 98, "png": "pages/00q-98-mcdp-intent-in-mission.png", "boxes": [[0.5193472488362262, 0.7581909747829374, 0.858182783151205, 0.788425631223368], [0.09124087776008667, 0.7842249823596541, 0.8564103537686696, 0.8117989788519477], [0.09400575284372566, 0.8070325441141448, 0.2543928927319933, 0.8355739929509444]], "folio": 89}], "page_layout": "pdf", "page_via": "the folio printed on the PDF page"}, "pom-mission-why": {"source": "00j", "corpus": "demo", "status": "exact", "verified": true, "hits": 1, "text": "The mission statement takes the why of a vision statement and gives a broad description of how the firm will try to make its vision a reality.", "anchor": "The mission statement takes the why of a vision statement", "line": 12669, "locator": "Ch 9.2 • Firm Vision and Mission", "page": 249, "context": {"before": "The first step in the process of developing a successful strategic position should be part of the founding of the firm itself. When entrepreneurs decide to start a business, they usually have a reason for starting it, a reason that answers the question “What is the point of this business?” Even if an entrepreneur initially thinks of starting a business in order to be their own boss, they must also have an idea about what their business will do. Overall, entrepreneurs start businesses for a variety of reasons. A vision statement is an expression of what a business’s founders want that business to accomplish. The vision statement is usually very broad, and it does not even have to mention a product or service. The vision statement does not describe the strategy a firm will use to follow its vision—it is simply a sentence or two that states why the business exists.\n\nCONCEPT CHECK", "after": "Exhibit 9.4 gives examples of vision and mission statements for the Walt Disney Company and for Ikea. Notice that in both cases, the vision statement is very broad and is not something a business could use as a strategy because there’s simply not enough information to exhibit out what kind of business they might be. The mission statements, on the other hand, describe the products and services each company plans to offer and the customers each company plans to serve in order to fulfill their vision.\n\nExhibit 9.4 Vision and Mission Statements (Attribution: Copyright Rice University, OpenStax, under CC-BY 4.0 license)", "lead": "9.2 • Firm Vision and Mission     249 While a firm’s vision statement is a general statement about its values, a firm’s mission statement is more specific.", "tail": "A mission statement is still not exactly a strategy, but it focuses on describing the products a firm plans to offer or the target markets it plans to serve."}, "layers": {"deep": {"path": "references/openstax-principles-management-deep.md", "line": 401, "text": "Table 7.6, from the SBA, gives a checklist to work through before starting a small business: identify your reasons; self-analysis; personal skills and experience; finding a niche; market research; planning the start-up by writing a business plan; and how to fund the business [AP] (Ch 7.4, Table 7.6, \"Checklist for Starting a Business\"). Table 7.8 sets out the key elements of a business plan [AP] (Ch 7.4, Table 7.8, \"", "marker": "AP", "match": "3 of 3 keywords"}, "light": {"path": "references/openstax-principles-management.md", "line": 50, "text": "The strategic management cycle integrates vision and mission, strategic analysis, strategic objectives, strategy formulation, implementation, and measurement — running simultaneously rather than strictly sequentially. A vision statement expresses what founders want the business to accomplish; a mission statement describes how. Strategic objectives are big-picture goals fulfilling the mission. Three strategy levels: b", "marker": null, "match": "3 of 3 keywords"}, "distillations": [{"path": "distillations/aar/openstax-principles-management-aar.md", "line": 18, "text": "4. <!-- concept: contingency-factors --> **Contingency thinking and environment-structure fit.** The contingency school holds that there are no universal rules in management: external and internal factors create unique situations, each needing a different response; its key statement is \"it depends\" [V] (Joan Woodward is one of its major theorists). The Duncan-Daft 2×2 (simple/complex × stable/unstable) places the env", "marker": "V", "match": "2 of 3 keywords", "task": "aar"}, {"path": "distillations/decision-making/openstax-principles-management-decision-making.md", "line": 38, "text": "12. <!-- concept: planning-modes --> **Goal vs domain vs hybrid planning.** Goal planning specifies goals and action statements; domain/directional planning identifies a domain and moves toward it without specifying outcomes (suits flexibility, goal disagreement, unstable environments, startups). Hybrid planning starts in domain mode and transitions to goal mode as learning accumulates. Research cited by the text fin", "marker": null, "match": "2 of 3 keywords", "task": "decision-making"}, {"path": "distillations/software-business/openstax-principles-management-software-business.md", "line": 28, "text": "7. <!-- concept: goal-vs-domain-planning --> **Goal vs domain vs hybrid planning.** Goal planning specifies goals and action statements. Domain (directional) planning identifies a domain and moves toward it without prescribing specific outcomes — suits flexibility, goal disagreement, unstable environments, startups, and 3M-Post-it-style serendipity. Hybrid planning starts in domain mode and transitions to goal mode a", "marker": null, "match": "2 of 3 keywords", "task": "software-business"}]}, "figure": null, "show": "paraphrase", "hit_page": 264, "pages": [{"n": 264, "png": "pages/00j-264-pom-mission-why.png", "boxes": [[0.17655882492564082, 0.09055679013030697, 0.8701618668300654, 0.10603406694200304], [0.11764705882352941, 0.107602 ns, with two stated themes: the variables that affect how, when, where, and why managers perform their jobs, and the theories and techniques successful managers use across organisational levels. Management is defined as the process of planning, organising, dire", "marker": null, "match": "2 of 3 keywords"}, "distillations": [{"path": "distillations/aar/openstax-principles-management-aar.md", "line": 61, "text": "| Name the conflict type | Is the conflict process-type (best-way disagreement, potentially productive) or relationship-type (personal attack, harmful)? The distinction shapes whether the contributory factor is the disagreement itself or the way it was handled. |", "marker": null, "match": "1 of 3 keywords", "task": "aar"}, {"path": "distillations/decision-making/openstax-principles-management-decision-making.md", "line": 8, "text": "OpenStax's Principles of Management dedicates Chapter 2 to managerial decision-making, treating it as a core managerial activity ranging from small daily choices to strategic organisational moves. The text grounds decision-making in dual-system cognitive theory — a reflective system (logical, analytical, deliberate) and a reactive system (quick, impulsive, intuitive) — and argues that effective managers learn which s", "marker": null, "match": "1 of 3 keywords", "task": "decision-making"}, {"path": "distillations/retro/openstax-principles-management-retro.md", "line": 62, "text": "| Name the conflict type driving the recurring pattern | Is the recurring issue a process conflict (best-way disagreement, potentially productive) or a relationship conflict (personal, to be quelled; Ch 2.4)? For a process disagreement, Follett's integration path (Ch 3.6) is the design target. |", "marker": null, "match": "1 of 3 keywords", "task": "retro"}, {"path": "distillations/software-business/openstax-principles-management-software-business.md", "line": 126, "text": "| Treat communication as invention | The text: \"communication is a process of
