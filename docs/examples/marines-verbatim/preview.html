Conduct of War", "after": "The intent for a unit is established by the commander as- signing that unit's mission—usually the next higher com- mander, although not always. A commander normally provides intent as part of the mission statement assigned to a subordinate. A subordinate commander who is not given a clear purpose for the assigned mission should ask for one. 89\n\nMCDP 1", "lead": "COMMANDER'S INTENT We achieve this harmonious initiative in large part through the use of the commander's intent, a device designed to help subordinates understand the larger context of their actions. The purpose of providing intent is to allow subordinates to exercise judgment and initiative—to depart from the original plan when the unforeseen occurs—in a way that is consistent with higher commanders' aims. There are two parts to any mission: the task to be accom- plished and the reason or intent behind it.° The intent is thus a part of every mission.", "tail": "Understanding the intent of our commander allows us to exercise initiative in harmony with the commander's de- sires."}, "layers": {"deep": {"path": "references/mcdp1-warfighting-deep.md", "line": 156, "text": "**Commander's intent.** The purpose of providing intent is *\"to allow subordinates to exercise judgment and initiative — to depart from the original plan when the unforeseen occurs — in a way that is consistent with higher commanders' aims.\"* [V] (Ch 4, \"Commander's intent\") *\"There are two parts to any mission: the task to be accomplished and the reason or intent behind it. The intent is thus a part of every mission", "marker": "V", "match": "3 of 3 keywords"}, "light": {"path": "references/mcdp1-warfighting.md", "line": 27, "text": "- **Ch 4 The Conduct of War.** The challenge. Maneuver warfare: shattering the enemy's cohesion rather than destroying him component by component. Orienting on the enemy. Philosophy of command: decentralized, human-centred, implicit communication, command from the front, coping with disorder. Shaping the action. Decisionmaking as a time-competitive process. Mission tactics: the senior assigns the mission and its inte", "marker": null, "match": "2 of 3 keywords"}, "distillations": [{"path": "distillations/aar/mcdp1-warfighting-aar.md", "line": 35, "text": "7. <!-- concept: commanders-intent --> **Task and intent.** \"The task describes the action to be taken while the intent describes the purpose of the action.\" [V] Intent is provided so that subordinates can exercise judgement and initiative, \"to depart from the original plan when the unforeseen occurs\" [V], in a way consistent with their seniors' aims, and \"the intent is predominant\" [V] (Source: Ch 4, \"Commander's in", "marker": "V", "match": "3 of 3 keywords", "task": "aar"}, {"path": "distillations/decision-making/mcdp1-warfighting-decision-making.md", "line": 11, "text": "Around that core the pamphlet supplies the rest of a decision system. Ch 1 sets the conditions: uncertainty cannot be removed, all action rests on incomplete, inaccurate or contradictory information, and risk attaches to inaction as much as to action (Ch 1, \"Uncertainty\"). Ch 4 answers *who decides* (decentralised command, mission tactics, commander's intent) and *what gets priority* (main effort, with prudent risk a", "marker": null, "match": "2 of 3 keywords", "task": "decision-making"}, {"path": "distillations/retro/mcdp1-warfighting-retro.md", "line": 9, "text": "MCDP 1 is Marine Corps warfighting doctrine, not a retrospective method, and it fires on the retro axis at moderate strength. Its retro contribution sits mostly in a few pages of Ch 3, with two tools from Ch 4 and one list of examples from Ch 1. Ch 3 describes the Marine Corps' own review practice, which the document calls a *critique*: held right after training, open to everyone, and focused on why people acted as t", "marker": null, "match": "3 of 3 keywords", "task": "retro"}, {"path": "distillations/software-business/mcdp1-warfighting-software-business.md", "line": 11, "text": "MCDP 1 gives an engineering leader a vocabulary for commanding work under uncertainty without trying to control every step of it. Four of its ideas land where engineering capacity meets commercial commitment. Every mission has a task and an intent, and the intent governs because it outlasts the task (Ch 4, \"Commander's intent\"). One action is named the main effort and gets priority for support, which means strict eco", "marker": "AR", "match": "2 of 3 keywords", "task": "software-business"}, {"path": "distillations/stakeholder-engagement/mcdp1-warfighting-stakeholder-engagement.md", "line": 21, "text": "3. <!-- concept: mission-tactics --> **The mission as a contract.** Mission tactics assigns a mission without specifying how it must be accomplished, and \"relies on a subordinate's exercise of initiative framed by proper guidance and understanding\" [V]. The senior still sets limits: \"The senior prescribes the method of execution only to the degree that is essential for coordination. The senior intervenes in a subordi", "marker": "V", "match": "3 of 3 keywords", "task": "stakeholder-engagement"}]}, "figure": null, "show": "quote", "hit_page": 98, "pages": [{"n": 98, "png": "pages/00q-98-mcdp-intent-predominant.png", "boxes": [[0.4093314534072816, 0.4728651861465959, 0.8587477734942239, 0.5014066903169773], [0.09400575284372566, 0.4983072350650236, 0.48446360933989113, 0.5253974500514824]], "folio": 89}], "page_layout": "pdf", "page_check": {"checked": true, "differences": [{"quote": "pre dominant", "page": "predominant", "corrected": true}, {"quote": "ob solete", "page": "obsolete", "corrected": true}]}, "page_via": "the folio printed on the PDF page"}, "mcdp-decentralize": {"source": "00q", "corpus": "demo", "status": "exact", "verified": true, "hits": 1, "text": "First and foremost, in order to generate the tempo of operations we desire and to best cope with the un- certainty, disorder, and fluidity of combat, command and con-trol must be decentralized. That is, subordinate commanders", "anchor": "First and foremost, in order to generate the tempo of operations", "line": 2499, "locator": "MCDP 1", "page": 78, "context": {"before": "77\n\nMCDP 1", "after": "must make decisions on their own initiative, based on their understanding of their senior's intent, rather than passing in- formation up the chain of command and waiting for the deci- sion to be passed down. Further, a competent subordinate commander who is at the point of decision will naturally bet- ter appreciate the true situation than a senior commander some distance removed. Individual initiative and responsibil- ity are of paramount importance. The principal means by which we implement decentralized command and control is through the use of mission tactics, which we will discuss in detail later.\n\nSecond, since we have concluded that war is a human en- terprise and no amount of technology can reduce the human dimension, our philosophy of command must be based on hu- man characteristics rather than on equipment or procedures. Communications equipment and command and staff proce- dures can enhance our ability to command, but they must not be used to lessen the human element of command. Our phi- losophy must not only accommodate but must exploit human traits such as boldness, initiative, personality, strength of will, and imagination. 78", "lead": "PmLosoPiw OF COMMAND It is essential that our philosophy of command support the way we fight.", "tail": ""}, "layers": {"deep": {"path": "references/mcdp1-warfighting-deep.md", "line": 42, "text": "5. **Mission tactics: the senior assigns a mission and its intent without specifying how it must be accomplished, and prescribes method only to the degree essential for coordination; subordinates decide on their own initiative within the senior's intent. Decentralized command is the document's means of generating the tempo maneuver warfare needs.** *\"Mission tactics is just as the name implies: the tactics of assigni", "marker": "V", "match": "2 of 3 keywords"}, "light": null, "distillations": [{"path": "distillations/aar/mcdp1-warfighting-aar.md", "line": 1, "text": "<!-- Generated by: claude-opus-5-5 | Effort: xhigh | Derived from verified deep ref | Task: aar | Date: 2026-09-27 -->", "marker": null, "match": "1 of 3 keywords", "task": "aar"}, {"path": "distillations/decision-making/mcdp1-warfighting-decision-making.md", "line": 1, "text": "<!-- Generated by: claude-opus-5-5 | Effort: xhigh | Derived from verified deep ref | Task: decision-making | Date: 2026-09-27 -->", "marker": null, "match": "1 of 3 keywords", "task": "decision-making"}, {"path": "distillations/retro/mcdp1-warfighting-retro.md", "line": 1, "text": "<!-- Generated by: claude-opus-5-5 | Effort: xhigh | Derived from verified deep ref | Task: retro | Date: 2026-09-27 -->", "marker": null, "match": "1 of 3 keywords", "task": "retro"}, {"path": "distillations/software-business/mcdp1-warfighting-software-business.md", "line": 1, "text": "<!-- Generated by: claude-opus-5-5 | Effort: xhigh | Derived from verified deep ref | Task: software-business | Date: 2026-09-27 -->", "marker": null, "match": "1 of 3 keywords", "task": "software-business"}, {"path": "distillations/stakeholder-engagement/mcdp1-warfighting-stakeholder-engagement.md", "line": 1, "text": "<!-- Generated by: claude-opus-5-5 | Effort: xhigh | Derived from verified deep ref | Task: stakeholder-engagement | Date: 2026-09-27 -->", "marker": null, "match": "1 of 3 keywords", "task": "stakeholder-engagement"}]}, "figure": null, "show": "quote", "hit_page": 87, "pages": [{"n": 87, "png": "pages/00q-87-mcdp-decentralize.png", "boxes": [[0.32963978068654426, 0.24440111620116964, 0.901987591475531, 0.2735414319439585], [0.1382437541819495, 0.2697329326174807, 0.4376036680496105, 0.29742827470889793]], "folio": 78}], "page_layout": "pdf", "page_check": {"checked": true, "differences": [{"quote": "un certainty", "page": "uncertainly"}, {"quote": "con trol", "page": "control", "corrected": true}]}, "page_via": "the folio printed on the PDF page"}, "pom-organic": {"source": "00j", "corpus": "demo", "status": "exact", "verified": true, "hits": 1, "text": "As Exhibit 4.4 shows, these organizational forms work best in unstable, complex, changing environments. Their structures are flatter, with participatory communication and decision-making flowing in different directions.", "anchor": "these organizational forms work best in unstable, complex, changing environments", "line": 4527, "locator": "Ch 4.2 • External Environments and Industries", "page": 83, "context": {"before": "Exhibit 4.5 Mechanistic and Organic Organizations (Attribution: Copyright Rice University, OpenStax, under CC-BY 4.0 license)\n\nEarly organizational theorists broadly categorized organizational structures and systems as either mechanistic or organic.21 This broad, generalized characterization of organizations remains relevant. Mechanistic organizational structures (Exhibit 4.5) are best suited for environments that range from stable and simple to low-moderate uncertainty (Exhibit 4.4) and are characterized by top-down hierarchies of control that are rule-based. The chain of command is highly centralized and uses formal authority; tasks are clearly defined and differentiated to be executed by specific specialized experts. Bosses and supervisors have fewer people working directly under them (i.e., a narrow span of control), and the organization is governed by rigid departmentalization (i.e., an organization is divided into different departments that perform specialized tasks according to the departments’ expertise). This form of organization represents a traditional type of structure that evolved in environments that were, as noted above, stable with low complexity. Historically, the U.S. Postal Service and other manufacturing types of industries (Exhibit 4.4) were mechanistic. Again, this type of organizational design may still be relevant, as Exhibit 4.4 suggests, in simple, stable, low-uncertainty environments.", "after": "84     4 • External and Internal Organizational Environments and Corporate Culture\n\nAccess for free at openstax.org Types of Organizational Structures", "lead": "Organic organizational structures and systems, however, have opposite characteristics from mechanistic ones.", "tail": "There is more fluidity and less-rigid ways of performing tasks; there may also be fewer rules. Tasks are more generalized and shared; there is a wider span of control (i.e., more people reporting to managers). Exhibit 4.5 offers examples of organically structured industries, such as high tech, computer, aerospace, and telecommunications industries, that must deal with change and uncertainty. Contemporary corporations and firms engaged in fast-paced, highly competitive, rapidly changing, and turbulent environments are becoming more organic in different ways, as we will discuss in this chapter. However, not every organization or every part of most organizations may require an organic type of structure. Understanding different organizational designs and structures is important to discern when, where, and under what circumstances a type of mechanistic system or part of an organization would be needed. The following section discusses five types of structures with variations."}, "layers": {"deep": {"path": "references/openstax-principles-management-deep.md", "line": 204, "text": "*Mechanistic organizational structures* are \"best suited for environments that range from stable and simple to low-moderate uncertainty … characterized by top-down hierarchies of control that are rule-based. The chain of command is highly centralized and uses formal authority; tasks are clearly defined and differentiated to be executed by specific specialized experts. Bosses and supervisors have fewer people working ", "marker": "V", "match": "3 of 3 keywords"}, "light": {"path": "references/openstax-principles-manageme hat there are no universal rules in management. External and internal factors create unique situations, and each situation requires a different response.", "anchor": "The contingency school changed this by proposing that there are no universal", "line": 3865, "locator": "Ch 3.7 • Contingency and System Management", "page": 69, "context": {"before": "3.7 • Contingency and System Management     69 Some of the leaders of the systems school were Kenneth Boulding, Daniel Katz, Robert Kahn, and Ludwig von Bertalanffy. These men came from diverse disciplines (psychology, economics, sociology, and even biology) and attempted to explain how external factors determine managerial outcomes.57 The major purpose behind systems school research was to understand the external conditions that organizations face and how to handle these conditions. The major overview of the systems theorists was that firms were an open system, that is, a system that interacts with its environment. In this case, the environment interacts with the firm in that it provides and accepts valued resources from the firm. For instance, the raw components of an iPhone are gathered by Apple. Through knowledge, procedures, tools, and resources, Apple takes these components and creates something of value for its customers, after which the consumer purchases the final product. In addition to providing financial resources to the firm, customers provide the firm with information—namely whether they like the product enough to purchase it.\n\nThe issue that systems management raises is that the managers’ actions are the products of outside factors. For example, if you are a human resource manager, the actions you take are determined by employment law. The law requires corporations to have tests that are both consistent and reliable. When a manager violates this law, the firm can expect a lawsuit. Likewise, the laws of supply and demand determine the salary range that a firm will offer to job applicants. If the firm pays above market, they can expect their pick of the best candidates; below market, they may have a difficult time finding quality workers. From a strategic perspective, how firms compete against each other will be determined, in part, by the general external environment. For example, Apple’s ability to sell iPhones is constricted by outside factors, including technology, suppliers, customers, and competitors. Every Android phone sold limits how many iPhones Apple can sell.", "after": "Modern Management\n\nFrom the 1970s to the present, we have seen the various management schools of thought interwoven. One of the major approaches in modern management is the development of managerial theories. When people hear the word theory, they usually assume that it refers to something impractical and disconnected from real life. The reality is that theory is a prediction and an explanation. Since the 1970s, the concept of theory has entered into the management literature and has led to more rigorous research.59 The body of knowledge explored in this book about concepts such as strategy, organizational behavior, human resource management, and organizational theory has many roots from the 1970s. Management has been enriched over the last 40 years by the contributions from researchers in allied fields such as economics, psychology, and sociology.", "lead": "The other school that made a contribution to management thought during this time was the contingency school. Prior to the development of the contingency school, management scholars sought the one best way of managing.", "tail": "What is the most appropriate response in one situation may not work in another. The key statement of the contingency school is “it depends.” One of the major theorists in this school is Joan Woodward, a British scholar who did her work in the 1950s and 1960s.58 She argued that contingencies, such as technology, play a role in how much training workers should receive. For instance, one of the major themes in management today is that workers should be well-trained. Woodward would argue that for low-tech jobs, this might not be the case but that for jobs requiring quite bit of technology, training would be a necessity."}, "layers": {"deep": {"path": "references/openstax-principles-management-deep.md", "line": 177, "text": "The contingency school (Joan Woodward in 1950s-1960s Britain) replaced the search for one-best-way with the principle that \"there are no universal rules in management. External and internal factors create unique situations, and each situation requires a different response. … The key statement of the contingency school is 'it depends.'\" [V] (Ch 3.7).", "marker": "V", "match": "2 of 3 keywords"}, "light": {"path": "references/openstax-principles-management.md", "line": 14, "text": "Five load-bearing claims structure the book. First, managerial work is fragmented, conversational, and interactive — managers spend most of their time in brief, unplanned verbal exchanges rather than executing the textbook list of activities. Second, managerial decision-making is a dual-system cognitive process, and effective managers learn when to engage which system. Third, organisations are open systems whose inte", "marker": null, "match": "1 of 3 keywords"}, "distillations": [{"path": "distillations/aar/openstax-principles-management-aar.md", "line": 18, "text": "4. <!-- concept: contingency-factors --> **Contingency thinking and environment-structure fit.** The contingency school holds that there are no universal rules in management: external and internal factors create unique situations, each needing a different response; its key statement is \"it depends\" [V] (Joan Woodward is one of its major theorists). The Duncan-Daft 2×2 (simple/complex × stable/unstable) places the env", "marker": "V", "match": "2 of 3 keywords", "task": "aar"}, {"path": "distillations/decision-making/openstax-principles-management-decision-making.md", "line": 10, "text": "Beyond Ch 2, decision-making is a recurring component of organisational processes addressed throughout the book. The history chapter (Ch 3) presents Mary Parker Follett's three conflict-resolution paths — dominance, compromise, integration — as foundational decision-making vocabulary, and contrasts Taylor's and Fayol's prescriptive approaches with Woodward's contingency-school \"it depends\". The strategic-analysis and", "marker": null, "match": "1 of 3 keywords", "task": "decision-making"}, {"path": "distillations/software-business/openstax-principles-management-software-business.md", "line": 77, "text": "| Plan for contingency | Have we built scenario plans for plausible disruptions (security event, partner-roadmap change, regulatory shift, economic shock)? Or is the plan brittle to disruption? | Ch 17.3 |", "marker": null, "match": "1 of 3 keywords", "task": "software-business"}, {"path": "distillations/stakeholder-engagement/openstax-principles-management-stakeholder-engagement.md", "line": 24, "text": "5. <!-- concept: ethical-principles --> **Seven ethical principles for stakeholder reasoning.** Utilitarianism (consequentialist), universalism (duty-based), rights, justice, virtue ethics, common good, ethical relativism. Each frames stakeholder claims differently; ethical relativism is presented with explicit limits (it can enable abuses such as apartheid). (Source: Ch 5.3)", "marker": null, "match": "1 of 3 keywords", "task": "stakeholder-engagement"}]}, "figure": null, "show": "paraphrase", "hit_page": 84, "pages": [{"n": 84, "png": "pages/00j-84-pom-contingency.png", "boxes": [[0.19572059780943626, 0.46442043420040247, 0.7908971449908089, 0.4798977013790246], [0.11764705882352941, 0.481465888745857, 0.8604413200827206, 0.4969431559244792], [0.11764705882352941, 0.4985113432913115, 0.18507352841445823, 0.5139886104699337]], "folio": 70}], "page_layout": "pdf"}, "caib-hro-both": {"source": "00u", "corpus": "demo", "status": "exact", "verified": true, "hits": 1, "text": "Ability to Operate in Both a Centralized and Decentralized Manner: The ability to operate in a centralized manner when appropriate, and to operate in a decentralized manner when appropriate, is the hallmark of a high-reliability organization.", "anchor": "manner when appropriate, is the hallmark of a high-reliability organization", "line": 17930, "locator": "18-7503-005, March 5, 1999,", "page": null, "context": {"before": "Commitment to a Safety Culture: NASA's safety culture has become reactive, complacent, and dominated by unjustified optimism. Over time, slowly and unintentionally, independent checks and balances intended to increase safety have been eroded in favor of detailed processes that produce massive amounts of data and unwarranted consensus, but little effective communication. Organizations that successfully deal with high-risk technologies create and sustain a disciplined safety system capable of identifying, analyzing, and controlling hazards throughout a technology's life cycle.\n\n7.2 ORGANIZATIONAL CAUSES: INSIGHTS FROM THEORY", "after": "To develop a thorough understanding of accident causes and risk, and to better interpret the chain of events that led to the Columbia accident, the Board turned to the contemporary social science literature on accidents and risk and sought insight from experts in High Reliability, Normal Accident, and Organizational Theory. 12 Additionally, the Board held a forum, organized by the National Safety Council, to define the essential characteristics of a sound safety program.\" Hi gh Reliability Theory argues that organizations operating high-risk technologies, if properly designed and managed, can compensate for inevitable human shortcomings, and therefore avoid mistakes that under other circumstances would lead to catastrophic failures.\" Normal Accident Theory, on the other hand, has a more pessimistic view of the ability of organizations and their members to manage high-risk technology. Normal Accident Theory holds that organizational and technological complexity contributes to failures. Organizations that aspire to failure-free performance are inevitably doomed to fail because of the inherent risks in the technology they operate. 15 Normal Accident models also emphasize systems approaches and systems thinking, while the High Reliability model works from the bottom up: if each component is highly reliable, then the system will be highly reliable and safe.\n\nNevertheless, it is evident that the position one occupies in this structure makes a difference. When supporting organizations try to \"push back\" against centralized Program direction — like the Debris Assessment Team did during STS-107 — independent analysis generated by a decentralized decision-making process can be stifled. The Debris Assessment Team, working in an essentially decentralized format, was well-led and had the right expertise to work the problem, but their charter was \"fuzzy,\" and the team had little direct connection to the Mission Management Team. This lack of connection to the Mission Management Team and the Mission Evaluation Room is the single most compelling reason why communications were so poor during the debris", "lead": "", "tail": "On the operational side, the Space Shuttle Program has a highly centralized structure. Launch commit criteria and flight rules govern every imaginable contingency. The Mission Control Center and the Mission Management Team have very capable decentralized processes to solve problems that are not covered by such rules. The process is so highly regarded that it is considered one of the best problemsolving organizations of its type.\" In these situations, mature processes anchor rules, procedures, and routines to make the Shuttle Program's matrixed workforce seamless, at least on the surface."}, "layers": {"deep": {"path": "references/caib-report-vol1-deep.md", "line": 198, "text": "- *Operating centralised and decentralised.* The ability to do both as appropriate is the hallmark of a high-reliability organisation. The Debris Assessment Team was well led and had the right expertise, but its charter was \"fuzzy\" and it had little connection to the Mission Management Team, which the Board calls \"the single most compelling reason why communications were so poor\" [V] (Ch 7, p. 180).", "marker": "V", "match": "2 of 3 keywords"}, "light": {"path": "references/caib-report-vol1.md", "line": 37, "text": "\"In the Board's view, NASA's organizational culture and structure had as much to do with this accident as the External Tank foam.\" [V] (Ch 7, p. 177). NASA's safety culture had become \"reactive, complacent, and dominated by unjustified optimism\" [V], and \"At every juncture of STS-107, the Shuttle Program's structure and processes, and therefore the managers in charge, resisted new information.\" [V] (Ch 7, pp. 180–181", "marker": "V", "match": "1 of 3 keywords"}, "distillations": [{"path": "distillations/aar/caib-report-vol1-aar.md", "line": 31, "text": "9. <!-- concept: high-reliability-organizations --> **Benchmarks for the action plan.** The Board measures NASA against organisations that manage high risk well: the Navy's submarine and reactor programmes and the Aerospace Corporation. Between them, they insist on airing minority opinions, use written staff work rather than slides, train on their own past accidents, and separate technical authority from cost and sch", "marker": "AE", "match": "2 of 3 keywords", "task": "aar"}, {"path": "distillations/decision-making/caib-report-vol1-decision-making.md", "line": 15, "text": "1. <!-- concept: inverted-burden-of-proof --> **Who must prove what.** For a hazardous operation the burden should be to prove it safe; NASA asked its engineers to prove it unsafe. \"Organizations that deal with high-risk operations must always have a healthy fear of failure — operations must be proved safe, rather than the other way around. NASA inverted this burden of proof.\" [V] (Ch 7, p. 190). The engineers were a", "marker": "V", "match": "1 of 3 keywords", "task": "decision-making"}, {"path": "distillations/retro/caib-report-vol1-retro.md", "line": 21, "text": "4. <!-- concept: minority-opinions --> **Seeking dissent when the room agrees.** \"Organizations with strong safety cultures generally acknowledge that a leader's best response to unanimous consent is to play devil's advocate and encourage an exhaustive debate.\" [V] (Ch 7, p. 192).", "marker": "V", "match": "1 of 3 keywords", "task": "retro"}]}, "figure": null, "show": "quote", "hit_page": 181, "pages": [{"n": 181, "png": "pages/00u-181-caib-hro-both.png", "boxes": [[0.5420608005008182, 0.5172073229224281, 0.9147324433197846, 0.5347168123074036], [0.5416385032035209, 0.5309999950616309, 0.9146829553552576, 0.5489393154679598], [0.5420608005008182, 0.5452224982221872, 0.9145270682669975, 0.5620872217846279], [0.5423986589586413, 0.5592553757234711, 0.9155640473236909, 0.5761200992859118], [0.5420608005008182, 0.5731618232582372, 0.7428411019814981, 0.5900265468206779]], "folio": null}], "page_layout": "pdf", "page_check": {"checked": true, "differences": []}}, "mcdp-intuitive-analytical": {"source": "00q", "corpus": "demo", "status": "loose", "verified": true, "hits": 1, "text": "Decisionmaking may be an intuitive process based on ex-perience. This will likely be the case at lower levels and in fluid, uncertain situations. Alternatively, decisionmaking may be a more analytical process based on comparing several op- tions. This will more likely be the case at higher levels or in deliberate planning situations.", "anchor": "Decisionmaking may be an intuitive process based on experience", "line": 2790, "locator": "MCDP 1", "page": 86, "context": {"before": "factor—such as deliberate planning situations—and should not rush our decisions unnecessarily.\n\nA military decision is not merely a mathematical computa- tion. Decisionmaking requires both the situational awareness to recognize the essence of a given problem and the creative ability to devise a practical solution. These abilities are the products of experience, education, and intelligence.", "after": "We should base our decisions on awareness rather than on mechanical habit. That is, we act on a keen appreciation for the essential factors that make each situation unique instead of from conditioned response. We must have the moral cour- age to make tough decisions in the face of uncertainty—and to accept full responsibility for those decisions—when the natural inclination would be to postpone the decision pending more complete information. To delay action in an emergency\n\nbecause of incomplete information shows a lack of moral courage. We do not want to make rash decisions, but we must not squander opportunities while trying to gain more informa- tion.", "lead": "", "tail": ""}, "layers": {"deep": {"path": "references/mcdp1-warfighting-deep.md", "line": 152, "text": "**Decisionmaking.** *\"any decision is generally better than no decision.\"* [V] (Ch 4, \"Decisionmaking\") *\"Time is a critical factor in effective decisionmaking — often the most important factor . . . whoever can make and implement decisions consistently faster gains a tremendous, often decisive advantage. Decisionmaking in execution thus becomes a time-competitive process.\"* [V] Speed is not always the constraint: *\"", "marker": "V", "match": "3 of 3 keywords"}, "light": {"path": "references/mcdp1-warfighting.md", "line": 27, "text": "- **Ch 4 The Conduct of War.** The challenge. Maneuver warfare: shattering the enemy's cohesion rather than destroying him component by component. Orienting on the enemy. Philosophy of command: decentralized, human-centred, implicit communication, command from the front, coping with disorder. Shaping the action. Decisionmaking as a time-competitive process. Mission tactics: the senior assigns the mission and its inte", "marker": null, "match": "1 of 3 keywords"}, "distillations": [{"path": "distillations/decision-making/mcdp1-warfighting-decision-making.md", "line": 9, "text": "MCDP 1 is a doctrine for war, and one of its Ch 4 sections is titled \"Decisionmaking\". That section is the core of this projection: it holds that \"any decision is generally better than no decision\" [V], that time is a critical factor in effective decisionmaking, often the most important one, that decisionmaking in execution is a time-competitive process, and that the opposite error is also real: where time is not a l", "marker": "V", "match": "2 of 3 keywords", "task": "decision-making"}, {"path": "distillations/retro/mcdp1-warfighting-retro.md", "line": 50, "text": "11. <!-- concept: awareness-over-habit --> **Decide on awareness, not habit.** *\"We should base our decisions on awareness rather than on mechanical habit. That is, we act on a keen appreciation for the essential factors that make each situation unique instead of from conditioned response\"* [V] (Source: U.S. Marine Corps, *MCDP 1*, Ch 4, \"Decisionmaking\"). In a retro: an experiment the team proposes every time, whate", "marker": "V", "match": "1 of 3 keywords", "task": "retro"}, {"path": "distillations/stakeholder-engagement/mcdp1-warfighting-stakeholder-engagement.md", "line": 94, "text": "| Right-size the wait | Is time actually a limiting factor here? If it is, am I holding out for information I will not get; if it is not, am I rushing? | Ch 4, \"Decisionmaking\" |", "marker": null, "match": "1 of 3 keywords", "task": "stakeholder-engagement"}]}, "figure": null, "show": "quote", "hit_page": 95, "pages": [{"n": 95, "png": "pages/00q-95-mcdp-intuitive-analytical.png", "boxes": [[0.1747669720371524, 0.3867575922752433, 0.6332906486839168, 0.4142836499837823], [0.25952315523709407, 0.4108020895659575, 0.538131606035755, 0.4390525310235541], [0.5525423737422864, 0.4108020895659575, 0.8526694710532128, 0.4390525310235541], [0.8688978496740111, 0.4108020895659575, 0.9022633277145706, 0.4390525310235541], [0.1414780249824567, 0.43674297092566455, 0.6409596630063014, 0.4635446725038644], [0.6486577150810657, 0.43674297092566455, 0.9043874858631438, 0.4635446725038644], [0.1414780249824567, 0.4607970519117014, 0.2650796095802233, 0.488081639164315], [0.27291635290232336, 0.4607970519117014, 0.7569465626624114, 0.488081639164315], [0.33104053610971496, 0.48503214597884714, 0.6189872698662884, 0.5127996741433115], [0.6331517246266131, 0.48503214597884714, 0.887441713908042, 0.5127996741433115], [0.13870394606123207, 0.5096868236175837, 0.5090426777921048, 0.5364885251957836]], "folio": 86}], "page_layout": "pdf", "page_check": {"checked": true, "differences": [{"quote": "ex perience", "page": "experience", "corrected": true}]}, "page_via": "the folio printed on the PDF page"}, "pom-two-systems": {"source": "00j", "corpus": "demo", "status": "exact", "verified": true, "hits": 1, "text": "The human brain processes information for decision-making using one of two routes: a reflective system and a reactive (or reflexive) system.2,3 The reflective system is logical, analytical, deliberate, and methodical, while the reactive system is quick, impulsive, and intuitive, relying on emotions or habits to provide cues for what to do next.", "anchor": "The reflective system is logical, analytical, deliberate, and methodical, while", "line": 1535, "locator": "Ch 2.1 • Overview of Managerial Decision-Making", "page": 25, "context": {"before": "2.1 • Overview of Managerial Decision-Making     25 2.2 How the Brain Processes Information to Make Decisions: Reflective and Reactive Systems\n\n2. What are the two systems of decision-making in the brain?", "after": "Reactive Decision-Making\n\nWe tend to assume that the logical, analytical route leads to superior decisions, but whether this is accurate depends on the situation. The quick, intuitive route can be lifesaving; when we suddenly feel intense fear, a fight-or-flight response kicks in that leads to immediate action without methodically weighing all possible options and their consequences. Additionally, experienced managers can often make decisions very quickly because experience or expertise has taught them what to do in a given situation. These managers might not be able to explain the logic behind their decision, and will instead say they just went with their “gut,” or did what “felt” right. Because the manager has faced a similar situation in the past and has figured out how to deal with it, the brain shifts immediately to the quick, intuitive decision-making system.5", "lead": "", "tail": "Research in neuropsychology suggests that the brain can only use one system at a time for processing information [Darlow & Sloman] and that the two systems are directed by different parts of the brain. The prefrontal cortex is more involved in the reflective system, and the basal ganglia and amygdala (more primitive parts of the brain, from an evolutionary perspective) are more involved in the reactive system.4"}, "layers": {"deep": {"path": "references/openstax-principles-management-deep.md", "line": 18, "text": "A second load-bearing claim is that *managerial decision-making is a dual-system cognitive process* and that effective managers must learn when to engage which system. The brain processes decisions through one of two routes — a reflective system (logical, analytical, deliberate, methodical) and a reactive system (quick, impulsive, intuitive) — and \"the brain can only use one system at a time for processing informatio", "marker": "AR", "match": "3 of 3 keywords"}, "light": {"path": "references/openstax-principles-management.md", "line": 22, "text": "The brain processes decisions through one of two routes: a reflective system (logical, analytical, deliberate) and a reactive system (quick, impulsive, intuitive); only one operates at a time. Decisions are programmed (rule-amenable, supports heuristics) or non-programmed (novel, ambiguous, requires the systematic six-step process). Six barriers recur: bounded rationality, escalation of commitment, time constraints, ", "marker": null, "match": "3 of 3 keywords"}, "distillations": [{"path": "distillations/decision-making/openstax-principles-management-decision-making.md", "line": 8, "text": "OpenStax's Principles of Management dedicates Chapter 2 to managerial decision-making, treating it as a core managerial activity ranging from small daily choices to strategic organisational moves. The text grounds decision-making in dual-system cognitive theory — a reflective system (logical, analytical, deliberate) and a reactive system (quick, impulsive, intuitive) — and argues that effective managers learn which s", "marker": null, "match": "3 of 3 keywords", "task": "decision-making"}, {"path": "distillations/software-business/openstax-principles-management-software-business.md", "line": 180, "text": "- **Skipping strategic analysis on big commitments.** SWOT, PESTEL, Five Forces, and VRIO are not optional ceremonies; they structure the evidence-gathering that the reflective system relies on.", "marker": null, "match": "1 of 3 keywords", "task": "software-business"}]}, "figure": null, "show": "paraphrase", "hit_page": 40, "pages": [{"n": 40, "png": "pages/00j-40-pom-two-systems.png", "boxes": [[0.11764705882352941, 0.14573865948301373, 0.8848676494523591, 0.1612159362947098], [0.11764705882352941, 0.16278411402846826, 0.31830883649439595, 0.17826138120709042], [0.3183088115617341, 0.16013326548566723, 0.33554353900984224, 0.17297939339069404], [0.3355434642118566, 0.16278411402846826, 0.8714994542738971, 0.17826138120709042], [0.11764705882352941, 0.17982956857392282, 0.8688089208665237, 0.19530683575254498], [0.11764705882352941, 0.19687502311937738, 0.19155882542429406, 0.2123522902979995]], "folio": 26}], "page_layout": "pdf"}, "pom-programmed-pairing": {"source": "00j", "corpus": "demo", "status": "exact", "verified": true, "hits": 1, "text": "Nonprogrammed decisions will generally need to be processed via the reflective system in our brains in order for us to reach a good decision. But with programmed decisions, heuristics can allow decision makers to switch to the quick, reactive system and then move along quickly to other issues.", "anchor": "Nonprogrammed decisions will generally need to be processed via the reflective system", "line": 1675, "locator": "Ch 2, Managerial Decision-Making", "page": 28, "context": {"before": "28     2 • Managerial Decision-Making\n\nAccess for free at openstax.org Exhibit 2.4 The Decision-Making Process. (Attribution: Copyright Rice University, OpenStax, under CC-BY 4.0 license)", "after": "1. Give an example of a programmed decision that a manager might face. 2. Give an example of a nonprogrammed decision. 3. What are heuristics, and when are they helpful? 4. How are programmed and nonprogrammed decisions connected to the reflective and reactive systems in the brain?\n\n2.4 Barriers to Effective Decision-Making", "lead": "You may notice similarities between the two systems of decision-making in our brains and the two types of decisions (programmed and nonprogrammed).", "tail": ""}, "layers": {"deep": {"path": "references/openstax-principles-management-deep.md", "line": 18, "text": "A second load-bearing claim is that *managerial decision-making is a dual-system cognitive process* and that effective managers must learn when to engage which system. The brain processes decisions through one of two routes — a reflective system (logical, analytical, deliberate, methodical) and a reactive system (quick, impulsive, intuitive) — and \"the brain can only use one system at a time for processing informatio", "marker": "AR", "match": "3 of 3 keywords"}, "light": {"path": "references/openstax-principles-management.md", "line": 22, "text": "The brain processes decisions through one of two routes: a reflective system (logical, analytical, deliberate) and a reactive system (quick, impulsive, intuitive); only one operates at a time. Decisions are programmed (rule-amenable, supports heuristics) or non-programmed (novel, ambiguous, requires the systematic six-step process). Six barriers recur: bounded rationality, escalation of commitment, time constraints, ", "marker": null, "match": "2 of 3 keywords"}, "distillations": [{"path": "distillations/decision-making/openstax-principles-management-decision-making.md", "line": 18, "text": "2. <!-- concept: programmed-vs-nonprogrammed --> **Programmed versus non-programmed decisions.** Programmed decisions are repeated and rule-amenable; they support heuristics that save time without guaranteeing optimality. Non-programmed decisions are novel, unstructured, and ambiguous; they require systematic processing through the reflective system and the six-step process: recognise, generate alternatives, analyse,", "marker": null, "match": "3 of 3 keywords", "task": "decision-making"}, {"path": "distillations/retro/openstax-principles-management-retro.md", "line": 112, "text": "Phase 4: the experiment is stated specifically: \"We will document major technical decisions in a shared log, linked from the relevant story, within one Sprint.\" Specific and accepted (Locke), measurable and time-bound (SMART). The team owns it.", "marker": null, "match": "1 of 3 keywords", "task": "retro"}, {"path": "distillations/software-business/openstax-principles-management-software-business.md", "line": 16, "text": "1. <!-- concept: organisational-structure --> **Six organisational structure types.** Functional (hierarchical pyramid by function — strong on specialisation, weak on silos and slow decisions); divisional (multiple functions under a division head, by market/geography/product — strong on focus and accountability, weak on system incompatibility); geographic (by customer location); matrix (vertical functional plus horiz", "marker": null, "match": "1 of 3 keywords", "task": "software-business"}, {"path": "distillations/stakeholder-engagement/openstax-principles-management-stakeholder-engagement.md", "line": 28, "text": "7. <!-- concept: hofstede-dimensions --> **Hofstede's four cultural dimensions.** Power distance, individualism vs collectivism, uncertainty avoidance, masculinity. Stakeholder engagement across cultures requires attention to all four; high-power-distance societies expect senior negotiators; high-collectivism societies make consensus decisions; high-uncertainty-avoidance societies want stability and rules. (Source: C", "marker": null, "match": "1 of 3 keywords", "task": "stakeholder-engagement"}]}, "figure": null, "show": "quote", "hit_page": 43, "pages": [{"n": 43, "png": "pages/00j-43-pom-programmed-pairing.png", "boxes": [[0.44648528254889197, 0.3049053230670967, 0.885470521216299, 0.3203825902457189], [0.11764705882352941, 0.3219507776125513, 0.8147646835426879, 0.33742804479117344], [0.11764705882352941, 0.33899623215800584, 0.8601911956188726, 0.354473499336628], [0.11764705882352941, 0.3560416481711648, 0.27536766201842067, 0.3715189153497869]], "folio": 29}], "page_layout": "pdf", "page_check": {"checked": true, "differences": []}}, "pom-reactive-expertise": {"source": "00j", "corpus": "demo", "status": "exact", "verified": true, "hits": 1, "text": "However, the reactive system can be lifesaving when time is of the essence, and it can be much more efficient when based on developed experience and expertise.", "anchor": "However, the reactive system can be lifesaving when time is", "line": 2670, "locator": "Ch 2, Managerial Decision-Making", "page": 44, "context": {"before": "2 • Key Terms     45 2.2 How the Brain Processes Information to Make Decisions: Reflective and Reactive Systems\n\n2. What are the two systems of decision-making in the brain?", "after": "2.3 Programmed and Nonprogrammed Decisions\n\n3. What is the difference between programmed and nonprogrammed decisions?", "lead": "The brain processes information to make decisions using one of two systems: either the logical, rational (reflective) system or the quick, reactive system. The reflective system is better for significant and important decisions; these generally should not be rushed.", "tail": ""}, "layers": {"deep": {"path": "references/openstax-principles-management-deep.md", "line": 18, "text": "A second load-bearing claim is that *managerial decision-making is a dual-system cognitive process* and that effective managers must learn when to engage which system. The brain processes decisions through one of two routes — a reflective system (logical, analytical, deliberate, methodical) and a reactive system (quick, impulsive, intuitive) — and \"the brain can only use one system at a time for processing informatio", "marker": "AR", "match": "1 of 3 keywords"}, "light": {"path": "references/openstax-principles-management.md", "line": 22, "text": "The brain processes decisions through one of two routes: a reflective system (logical, analytical, deliberate) and a reactive system (quick, impulsive, intuitive); only one operates at a time. Decisions are programmed (rule-amenable, supports heuristics) or non-programmed (novel, ambiguous, requires the systematic six-step process). Six barriers recur: bounded rationality, escalation of commitment, time constraints, ", "marker": null, "match": "1 of 3 keywords"}, "distillations": [{"path": "distillations/decision-making/openstax-principles-management-decision-making.md", "line": 8, "text": "OpenStax's Principles of Management dedicates Chapter 2 to managerial decision-making, treating it as a core managerial activity ranging from small daily choices to strategic organisational moves. The text grounds decision-making in dual-system cognitive theory — a reflective system (logical, analytical, deliberate) and a reactive system (quick, impulsive, intuitive) — and argues that effective managers learn which s", "marker": null, "match": "1 of 3 keywords", "task": "decision-making"}, {"path": "distillations/software-business/openstax-principles-management-software-business.md", "line": 104, "text": "| Distinguish process from relationship conflict | Is the team's disagreement productive process conflict (improves outcomes) or corrosive relationship conflict (pushes participants into reactive-system processing)? Surface the first; quell the second. | Ch 2.4 |", "marker": null, "match": "1 of 3 keywords", "task": "software-business"}, {"path": "distillations/stakeholder-engagement/openstax-principles-management-stakeholder-engagement.md", "line": 121, "text": "- **Pattern: Conflict has descended into personal attack.** Signal: arguments about people rather than issues. Diagnosis: process conflict has shifted into relationship conflict; participants are in reactive-system processing. Follow-up: pause; reframe to substantive disagreements; consider third-party consultation.", "marker": null, "match": "1 of 3 keywords", "task": "stakeholder-engagement"}]}, "figure": null, "show": "paraphrase", "hit_page": 60, "pages": [{"n": 60, "png": "pages/00j-60-pom-reactive-expertise.png", "boxes": [[0.4544411453546262, 0.1746477454599708, 0.8684264538334865, 0.19012501263859297], [0.11764705882352941, 0.19169320000542533, 0.8224558113447202, 0.2071704671840475]], "folio": 46}], "page_layout": "pdf"}, "pom-time-constraints": {"source": "00j", "corpus": "demo", "status": "exact", "verified": true, "hits": 1, "text": "When there is little time available to collect information and to rationally process it, we are much less likely to make a good nonprogrammed decision.", "anchor": "When there is little time available to collect information and to rationally", "line": 1736, "locator": "Ch 2.4 • Barriers to Effective Decision-Making", "page": 29, "context": {"before": "direction when appropriate.\n\nTime Constraints", "after": "Uncertainty\n\nIn addition, managers frequently make decisions under conditions of uncertainty—they cannot know the outcome of each alternative until they’ve actually chosen that alternative. Consider, for example, a manager who is trying to decide between one of two possible marketing campaigns. The first is more conservative but is consistent with what the organization has done in the past. The second is more modern and edgier, and might bring much better results . . . or it might be a spectacular failure. The manager making the decision will ultimately have to choose one campaign and see what happens, without ever knowing what the results would have been with the alternate campaign. That uncertainty can make it difficult for some managers to make decisions, because committing to one option means forgoing other options.", "lead": "Managers often face time constraints that can make effective decision-making a challenge.", "tail": "Time pressures can cause us to rely on heuristics rather than engage in deep processing. While heuristics save time, however, they don’t necessarily lead to the best possible solution. The best managers are constantly assessing the risks associated with acting too quickly against those associated with not acting quickly enough."}, "layers": {"deep": {"path": "references/openstax-principles-management-deep.md", "line": 18, "text": "A second load-bearing claim is that *managerial decision-making is a dual-system cognitive process* and that effective managers must learn when to engage which system. The brain processes decisions through one of two routes — a reflective system (logical, analytical, deliberate, methodical) and a reactive system (quick, impulsive, intuitive) — and \"the brain can only use one system at a time for processing informatio", "marker": "AR", "match": "1 of 3 keywords"}, "light": {"path": "references/openstax-principles-management.md", "line": 18, "text": "Mintzberg's CEO observations found managers averaged 36 written and 16 verbal contacts per day, \"almost every one of them dealing with a distinct or different issue\", with most activities lasting less than nine minutes. Kotter's general managers spent only 25 per cent of their time alone. Stewart's 160 British managers spent 47 per cent of their time with peers, 41 per cent with their unit, and only 12 per cent with ", "marker": null, "match": "1 of 3 keywords"}, "distillations": [{"path": "distillations/decision-making/openstax-principles-management-decision-making.md", "line": 16, "text": "1. <!-- concept: dual-process-theory --> **Reflective versus reactive systems.** The brain processes decisions through one of two routes at a time: a reflective system (prefrontal cortex, logical, analytical, deliberate) and a reactive system (basal ganglia and amygdala, quick, impulsive, intuitive). \"Research in neuropsychology suggests that the brain can only use one system at a time for processing information\" [V]", "marker": "V", "match": "1 of 3 keywords", "task": "decision-making"}, {"path": "distillations/software-business/openstax-principles-management-software-business.md", "line": 125, "text": "| Apply Mintzberg's roles | Which role is on duty — figurehead, leader, liaison (interpersonal); monitor, disseminator, spokesperson (informational); entrepreneur, disturbance handler, resource allocator, negotiator (decisional)? Most managerial work is conversational; the role shapes the communication. | Ch 1.2, Ch 16.3 |", "marker": null, "match": "1 of 3 keywords", "task": "software-business"}, {"path": "distillations/stakeholder-engagement/openstax-principles-management-stakeholder-engagement.md", "line": 38, "text": "12. <!-- concept: liaison-role --> **Mintzberg's liaison role.** Managers spend more time with peers than with anyone else (47 per cent in Stewart's study, against 12 per cent with superiors). The liaison role establishes and maintains connections that produce the information and trust needed for stakeholder work. (Source: Ch 1.2 and Ch 16.3)", "marker": null, "match": "1 of 3 keywords", "task": "stakeholder-engagement"}]}, "figure": null, "show": "paraphrase", "hit_page": 44, "pages": [{"n": 44, "png": "pages/00j-44-pom-time-constraints.png", "boxes": [[0.747588163886974, 0.3962386160185843, 0.880926593456393, 0.4117158831972064], [0.11764705882352941, 0.4132840705640388, 0.8328970117506638, 0.428761337742661], [0.11764705882352941, 0.43032952510949335, 0.3011324265423943, 0.44580679228811554]], "folio": 30}], "page_layout": "pdf"}, "mcdp-any-decision": {"source": "00q", "corpus": "demo", "status": "exact", "verified": true, "hits": 1, "text": "If we fail to make a decision out of lack of will, we have willingly surrendered the initiative to our foe. If we consciously post- pone taking action for some reason, that is a decision. Thus, as a basis for action, any decision is generally better than no decision.", "anchor": "If we fail to make a decision out of lack of will", "line": 2750, "locator": "DECIsI0NMAIUNG", "page": 85, "context": {"before": "MCDP 1\n\nThe Conduct of War", "after": "Since war is a conflict between opposing wills, we cannot make decisions in a vacuum. We must make our decisions in light of the enemy's anticipated reactions and counteractions, recognizing that while we are trying to impose our will on the enemy, he is trying to do the same to us. Time is a critical factor in effective decisionmaking—often\n\nthe most important factor. A key part of effective decision- making is realizing how much decision time is available and making the most of that time. In general, whoever can make and implement decisions consistently faster gains a tremen- dous, often decisive advantage. Decisionmaking in execution thus becomes a time-competitive process, and timeliness of decisions becomes essential to generating tempo. Timely de- cisions demand rapid thinking with consideration limited to essential factors. In such situations, we should spare no effort to accelerate our decisionmaking ability. That said, we should also recognize those situations in which time is not a limiting 85", "lead": "DECIsI0NMAIUNG Decisionmaking is essential to the conduct of war since all actions are the result of decisions or of nondecisions.", "tail": ""}, "layers": {"deep": {"path": "references/mcdp1-warfighting-deep.md", "line": 25, "text": "- **Ch 4 The Conduct of War** — the challenge, maneuver warfare, orienting on the enemy, philosophy of command, shaping the action, decisionmaking, mission tactics, commander's intent, main effort, surfaces and gaps, combined arms.", "marker": null, "match": "1 of 1 keywords"}, "light": {"path": "references/mcdp1-warfighting.md", "line": 26, "text": "- **Ch 3 Preparing for War.** Concept-based force planning. Organization in Marine air-ground task forces (MAGTFs). Doctrine as authoritative but not prescriptive: general guidance that requires judgment in application. Professionalism: boldness and initiative, leniency for errors of overboldness and severity for errors of inaction or timidity, trust, honest dissent before a decision and full support after it. Traini", "marker": null, "match": "1 of 1 keywords"}, "distillations": [{"path": "distillations/aar/mcdp1-warfighting-aar.md", "line": 33, "text": "6. <!-- concept: honest-dissent-before-decision --> **Candour before the decision, support after.** \"Until a commander has reached and stated a decision, subordinates should consider it their duty to provide honest, professional opinions even though these may be in disagreement with the senior's opinions.\" [V] Once the decision is made, juniors support it as their own, and ready compliance for personal advancement wi", "marker": "V", "match": "1 of 1 keywords", "task": "aar"}, {"path": "distillations/decision-making/mcdp1-warfighting-decision-making.md", "line": 1, "text": "<!-- Generated by: claude-opus-5-5 | Effort: xhigh | Derived from verified deep ref | Task: decision-making | Date: 2026-09-27 -->", "marker": null, "match": "1 of 1 keywords", "task": "decision-making"}, {"path": "distillations/retro/mcdp1-warfighting-retro.md", "line": 9, "text": "MCDP 1 is Marine Corps warfighting doctrine, not a retrospective method, and it fires on the retro axis at moderate strength. Its retro contribution sits mostly in a few pages of Ch 3, with two tools from Ch 4 and one list of examples from Ch 1. Ch 3 describes the Marine Corps' own review practice, which the document calls a *critique*: held right after training, open to everyone, and focused on why people acted as t", "marker": null, "match": "1 of 1 keywords", "task": "retro"}, {"path": "distillations/software-business/mcdp1-warfighting-software-business.md", "line": 6, "text": "**Pass G verdict:** fire-narrow on four seed triggers: Phase 2 (roadmap-capacity mismatch), Phase 3 (engineering-management culture decision) and Phase 4 (governance or decision-rights ambiguity; retrospective or learning-loop need). The call was close. MCDP 1 is doctrine for war and says nothing about software, products, markets, pricing or finance. What transfers is its account of how seniors direct and prepare sub", "marker": null, "match": "1 of 1 keywords", "task": "software-business"}, {"path": "distillations/stakeholder-engagement/mcdp1-warfighting-stakeholder-engagement.md", "line": 9, "text": "MCDP 1 is the Marine Corps' statement of how it fights and prepares to fight. Its parties are seniors, subordinates, peers inside one command, and an enemy. It never uses the word *stakeholder* and offers no theory of who has standing in a decision. It defines the essence of war as a violent struggle between two hostile, independent and irreconcilable wills, each trying to impose itself on the other (Ch 1, \"War defin", "marker": "AP", "match": "1 of 1 keywords", "task": "stakeholder-engagement"}]}, "figure": null, "show": "paraphrase", "hit_page": 94, "pages": [{"n": 94, "png": "pages/00q-94-mcdp-any-decision.png", "boxes": [[0.7933968151088421, 0.254998870765384, 0.8615493511840164, 0.28356521133301854], [0.09154460440041316, 0.2804342574448904, 0.6249445806453306, 0.3082743489621841]], "folio": 85}], "page_layout": "pdf", "page_via": "the folio printed on the PDF page"}, "mcdp-zero-defects": {"source": "00q", "corpus": "demo", "status": "loose", "verified": true, "hits": 1, "text": "These traits carried to excess can lead to rashness, but we must realize that errors by junior leaders stemming from overboldness are a neces-sary part of learning.6 We should deal with such errors leni-ently; there must be no \"zero defects\" mentality. Abolishing \"zero defects\" means that we do not stifle boldness or initia-tive through the threat of punishment.", "anchor": "We should deal with such errors leniently; there must be no", "line": 1856, "locator": "Preparing for War", "page": 57, "context": {"before": "Preparing for War\n\nThe military profession is a thinking profession. Every Marine is expected to be a student of the art and science of war. Officers especially are expected to have a solid founda- tion in military theory and a knowledge of military history and the timeless lessons to be gained from it. Leaders must have a strong sense of the great responsibil- ity of their office; the resources they will expend in war are human lives.", "after": "Not only must we not stifle boldness or initiative, but we must continue to encourage both traits in spite of mistakes. 57\n\nWarfighting", "lead": "The Marine Corps' style of warfare requires intelligent leaders with a penchant for boldness and initiative down to the lowest levels. Boldness is an essential moral trait in a leader for it generates combat power beyond the physical means at hand. Initiative, the willingness to act on one's own judgment, is a prerequisite for boldness.", "tail": "It does not mean that commanders do not counsel subordinates on mistakes; con- structive criticism is an important element in learning. Nor does it give subordinates free license to act stupidly or reck- lessly."}, "layers": {"deep": {"path": "references/mcdp1-warfighting-deep.md", "line": 116, "text": "**Professionalism.** *\"The military profession is a thinking profession. Every Marine is expected to be a student of the art and science of war.\"* [V] (Ch 3, \"Professionalism\") ion-making"}, {"path": "distillations/retro/mcdp1-warfighting-retro.md", "line": 28, "text": "> We should deal with such errors leniently; there must be no \"zero defects\" mentality. Abolishing \"zero defects\" means that we do not stifle boldness or initiative through the threat of punishment. It does not mean that commanders do not counsel subordinates on mistakes; constructive criticism is an important element in learning. Nor does it give subordinates free license to act stupidly or recklessly.", "marker": null, "match": "3 of 3 keywords", "task": "retro"}, {"path": "distillations/software-business/mcdp1-warfighting-software-business.md", "line": 11, "text": "MCDP 1 gives an engineering leader a vocabulary for commanding work under uncertainty without trying to control every step of it. Four of its ideas land where engineering capacity meets commercial commitment. Every mission has a task and an intent, and the intent governs because it outlasts the task (Ch 4, \"Commander's intent\"). One action is named the main effort and gets priority for support, which means strict eco", "marker": "AR", "match": "2 of 3 keywords", "task": "software-business"}, {"path": "distillations/stakeholder-engagement/mcdp1-warfighting-stakeholder-engagement.md", "line": 41, "text": "11. <!-- concept: leniency-overbold-severity-inaction --> **Leniency for overbold errors, severity for inaction.** \"errors by junior leaders stemming from overboldness are a necessary part of learning\" [V], and \"there must be no 'zero defects' mentality\" [V]; on the other hand \"we should deal severely with errors of inaction or timidity\" [V], and \"We will not accept lack of orders as justification for inaction\" [V]. ", "marker": "V", "match": "2 of 3 keywords", "task": "stakeholder-engagement"}]}, "figure": null, "show": "quote", "hit_page": 66, "pages": [{"n": 66, "png": "pages/00q-66-mcdp-zero-defects.png", "boxes": [[0.6108942957357967, 0.5171257989062543, 0.8568612961561057, 0.5451835769043827
