<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- AAR Maker icon: a lens over a timeline, one past moment examined. -->
  <defs>
    <clipPath id="lens"><circle cx="220" cy="220" r="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#1f5f8b"/>
  <!-- the timeline, running past the lens -->
  <line x1="58" y1="220" x2="454" y2="220" stroke="#cfe0ec" stroke-width="22" stroke-linecap="round"/>
  <circle cx="72" cy="220" r="24" fill="#cfe0ec"/>
  <circle cx="420" cy="220" r="24" fill="#cfe0ec"/>
  <!-- inside the lens: the moment, enlarged -->
  <circle cx="220" cy="220" r="112" fill="#1f5f8b"/>
  <g clip-path="url(#lens)">
    <line x1="58" y1="220" x2="454" y2="220" stroke="#fff" stroke-width="30"/>
    <circle cx="220" cy="220" r="54" fill="#f2a93b"/>
  </g>
  <circle cx="220" cy="220" r="112" fill="none" stroke="#fff" stroke-width="36"/>
  <line x1="306" y1="306" x2="410" y2="410" stroke="#fff" stroke-width="58" stroke-linecap="round"/>
</svg>
